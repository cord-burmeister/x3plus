amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # The fully-qualified type of the plugin class. Options are “nav2_amcl::DifferentialMotionModel” 
    # and “nav2_amcl::OmniMotionModel”. Users can also provide their own custom motion model plugin type.
    # robot_model_type: "nav2_amcl::DifferentialMotionModel"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # This increases the TF buffer size to 5 seconds, which helps prevent transform extrapolation issues.
    tf_buffer_duration: 5.0  # Duration in seconds
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Setting pose (29.350000): 0.019 0.003 0.000

    set_initial_pose: true
    always_reset_initial_pose: true

    initial_pose:
      x: 0.019 
      y: .003
      z: 0.0
      yaw: 0.0 #yaw: 1.615

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: "/odometry/filtered"
    # Setting the BT loop duration to 100ms allows for a more responsive navigation experience, especially in dynamic environments.
    bt_loop_duration: 100
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    verbose: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    # failure_tolerance: Number of consecutive controller failures tolerated before declaring failure.
    #   Impact:  Higher = more lenient; lower = faster failure detection and recovery trigger.
    #   Default: 0.3 | Range: 0.0–5.0
    failure_tolerance: 1.0

    # progress_checker_plugins: List of progress checker plugin names to load.
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: "/odometry/filtered"


    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: Minimum distance (m) the robot must move within movement_time_allowance to be considered making progress.
      #   Impact:  Too high = premature failure on slow robots or tight spaces; too low = misses stuck condition.
      #   Default: 0.5 | Range: 0.05–1.0
      required_movement_radius: 0.10
      # movement_time_allowance: Time window (s) in which required_movement_radius must be achieved.
      #   Impact:  Increase for slow robots or high-latency planners.
      #   Default: 10.0 | Range: 5.0–60.0
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # xy_goal_tolerance: Cartesian distance (m) from goal position to consider it reached.
      #   Impact:  Lower = more precise stopping; higher = allows robot to stop slightly early.
      #   Default: 0.25 | Range: 0.05–0.5
      xy_goal_tolerance: 0.3
      # yaw_goal_tolerance: Angular tolerance (rad) from goal heading to consider it reached.
      #   Impact:  Lower = stricter heading alignment at goal; higher = any orientation accepted.
      #   Default: 0.25 | Range: 0.05–3.14
      yaw_goal_tolerance: 0.25
    # The most common parameters you might want to start off changing are the velocity profiles (vx_max, vx_min, wz_max, and vy_max if holonomic) 
    # and the motion_model to correspond to your vehicle. Its wise to consider the prune_distance of the path plan in proportion to your maximum 
    # velocity and prediction horizon. The only deeper parameter that will likely need to be adjusted for your particular settings is the Obstacle critics’ 
    # repulsion_weight since the tuning of this is proprtional to your inflation layer’s radius. Higher radii should correspond to reduced repulsion_weight 
    # due to the penalty formation (e.g. inflation_radius - min_dist_to_obstacle). If this penalty is too high, the robot will slow significantly 
    # when entering cost-space from non-cost space or jitter in narrow corridors. It is noteworthy, but likely not necessary to be changed, 
    # that the Obstacle critic may use the full footprint information if consider_footprint = true, though comes at an increased compute cost.      
    # Prediction Horizon, Costmap Sizing, and Offsets
    # As this is a predictive planner, there is some relationship between maximum speed, prediction times, and costmap size that users should keep
    #  in mind while tuning for their application. If a controller server costmap is set to 3.0m in size, that means that with the robot in the center, 
    # there is 1.5m of information on either side of the robot. When your prediction horizon (time_steps * model_dt) at maximum speed (vx_max) is larger than this, 
    # then your robot will be artificially limited in its maximum speeds and behavior by the costmap limitation. 
    # For example, if you predict forward 3 seconds (60 steps @ 0.05s per step) at 0.5m/s maximum speed, the minimum required costmap radius is 1.5m - or 3m total width.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Default 56. Number of time steps (points) in each sampled trajectory
      time_steps: 56
      # Default: 0.05. Time interval (s) between two sampled points in trajectories.
      # The model_dt parameter generally should be set to the duration of your control frequency. So if your control frequency is 20hz, 
      # this should be 0.05. However, you may also set it lower but not larger.
      model_dt: 0.05
      # Default 1000. Count of randomly sampled candidate trajectories
      batch_size: 2000
      # Maximum forward acceleration (m/s^2).
      ax_max: 3.0
      # Maximum deceleration along the X-axis (m/s^2).
      ax_min: -3.0
      # Maximum lateral acceleration in either direction, if using Omni motion model (m/s^2).
      ay_max: 3.0
      # Maximum angular acceleration (rad/s^2).
      az_max: 3.5
      # Default 0.2. Sampling standard deviation for VX
      vx_std: 0.2
      # Default 0.2. Sampling standard deviation for VY
      vy_std: 0.2
      # Default 0.4. Sampling standard deviation for Wz
      # This parameter controls the standard deviation for the angular velocity sampling. By adjusting this, you can influence 
      # how much rotational variation is considered during trajectory sampling.
      wz_std: 3.2
      # Default 0.5. Max VX (m/s)
      vx_max: 0.5
      # Default -0.35. Min VX (m/s)
      vx_min: -0.35
      # Default 0.5. Max VY in either direction, if holonomic. (m/s)
      vy_max: 0.25
      # Default 1.9. Max WZ (rad/s)
      # wz_max: 1.9
      wz_max: 13.8
      # Default 1. Iteration count in MPPI algorithm. Recommend to keep as 1 and prefer more batches.
      iteration_count: 1
      # Default: 0.3. Selectiveness of trajectories by their costs (The closer this value to 0, the "more" 
      # we take in consideration controls with less cost), 0 mean use control with best cost, huge value will lead to just taking
      #  mean of all trajectories without cost consideration
      temperature: 0.3
      # Default: 0.015. A trade-off between smoothness (high) and low energy (low). This is a complex parameter that likely won't
      #  need to be changed from the default of 0.1 which works well for a broad range of cases. See Section 3D-2 in "Information 
      # Theoretic Model Predictive Control: Theory and Applications to Autonomous Driving" for detailed information.
      gamma: 0.015
      # Default: DiffDrive. Type of model [DiffDrive, Omni, Ackermann].
      motion_model: "DiffDrive"
      # Default: false. Publish visualization of trajectories, which can slow down the controller significantly. Use only for debugging.
      # Visualization of the trajectories using visualize uses compute resources to back out trajectories for visualization and therefore slows compute time. 
      # It is not suggested that this parameter is set to true during a deployed use, but is a useful debug instrument while tuning the system, 
      # but use sparingly. Visualizing 2000 batches @ 56 points at 30 hz is a lot.
      # @open
      visualize: true 
      # 	Default false. Whether to regenerate noises each iteration or use single noise distribution computed on initialization and reset. 
      # Practically, this is found to work fine since the trajectories are being sampled stochastically from a normal distribution and 
      # reduces compute jittering at run-time due to thread wake-ups to resample normal distribution.  
      regenerate_noises: true
      # Path Handler
      # Default: 1.5. Distance ahead of nearest point on path to robot to prune path to.
      prune_distance: 1.7
      # Default: 0.1. Time tolerance for data transformations with TF.
      transform_tolerance: 0.1
      # max_robot_pose_search_dist	double	Default: Costmap half-size. Max integrated distance ahead of robot pose to search for nearest path point in case of path looping.
      # enforce_path_inversion	double	Default: False. If true, it will prune paths containing cusping points for segments changing directions 
      #   (e.g. path inversions) such that the controller will be forced to change directions at or very near the planner's requested inversion point. 
      #    This is targeting Smac Planner users with feasible paths who need their robots to switch directions where specifically requested.
      # inversion_xy_tolerance	double	Default: 0.2. Cartesian proximity (m) to path inversion point to be considered "achieved" to pass on the rest of the path after path inversion.
      # inversion_yaw_tolerance	double	Default: 0.4. Angular proximity (radians) to path inversion point to be considered "achieved" to pass on the rest of the path after path inversion. 0.4 rad = 23 deg.
      TrajectoryVisualizer:
        # Default: 5. The step between trajectories to visualize to downsample candidate trajectory pool.
        trajectory_step: 5
        # 	Default: 3. The step between points on trajectories to visualize to downsample trajectory density.
        time_step: 3
      AckermannConstraints:
        # minimum turning radius for ackermann motion model
        min_turning_r: 0.5
      # Default: None. Critics (plugins) names
      critics: [
        "ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes navigating away from obstacles and critical collisions using either a circular
      #  robot point-check or full SE2 footprint check using distances from obstacles.
      ObstaclesCritic:
        # Weight to apply to critic for near collisions closer than collision_margin_distance to prevent near collisions only 
        # as a method of virtually inflating the footprint. This should not be used to generally influence obstacle avoidance away from critical collisions.
        critical_weight: 20.0 
        # Weight to apply to critic for generally preferring routes in lower cost space. This is separated from the critical term to allow
        #  for fine tuning of obstacle behaviors with path alignment for dynamic scenes without impacting actions which may directly lead to near-collisions. 
        # This is applied within the inflation_radius distance from obstacles.
        # Increased for stronger wall avoidance in narrow indoor spaces.
        repulsion_weight: 2.0
        # Power order to apply to term.
        cost_power: 1
        # Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        consider_footprint: true
        # Cost to apply to a true collision in a trajectory.
        collision_cost: 100000.0
        # Margin distance (m) from collision to apply severe penalty, similar to footprint inflation. Between 0.05-0.2 is reasonable. 
        # Note that it will highly influence the controller not to enter spaces more confined than this, so ensure this parameter 
        # is set lower than the narrowest you expect the robot to need to traverse through.
        collision_margin_distance: 0.12
        # Distance (m) near goal to stop applying preferential obstacle term to allow robot to smoothly converge to goal pose in close proximity to obstacles
        near_goal_distance: 0.70
        # Exponential decay factor across inflation radius. This should be the same as for your inflation layer (Humble only)
        cost_scaling_factor: 2.0
        # Radius to inflate costmap around lethal obstacles. This should be the same as for your inflation layer (Humble only)
        # Match the costmap inflation settings to keep behavior consistent.
        inflation_radius: 0.45
        # Name of the inflation layer. If empty, it uses the last inflation layer in the costmap. If you have multiple inflation layers, 
        # you may want to specify the name of the layer to use.'
        # inflation_layer_name: ""
      # ----------------------------------------------------------------------------------------
      # This critic penalizes trajectories that have components outside of the set dynamic or kinematic constraints
      ConstraintCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 4.0. Weight to apply to critic term.
        cost_weight: 4.0
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes navigating spatially towards the goal when in reasonable proximity to goal
      GoalCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 5.0. Weight to apply to critic term.
        cost_weight: 8.0
        # Default 1.4. Distance between robot and goal above which goal cost starts being considered
        # It is wise to start with this as being the same as your prediction horizon to have a clean hand-off with the path follower critic.
        threshold_to_consider: 0.8
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes navigating to achieve the angle of the goal posewhen in reasonable proximity to goal
      GoalAngleCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 3.0. Weight to apply to critic term.
        cost_weight: 3.0
        # Default 0.5. Minimal distance between robot and goal above which angle goal cost considered.
        # There is a correlation to the goal checker, becasue it might rotate to the target angle too aggressivly
        # outside the    general_goal_checker:  xy_goal_tolerance: 0.25 distance when rotating parameter wz_std: 3.2
        # has high values. Setting this below tolerance
        threshold_to_consider: 0.2
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes moving in the forward direction, rather than reversing.
      PreferForwardCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 5.0
        # Distance (m) between robot and goal to stop considering preferring forward and allow goal critics to take over.
        threshold_to_consider: 0.5
      # ----------------------------------------------------------------------------------------------------
      # Uses inflated costmap cost directly to avoid obstacles
      # This critic incentivizes navigating away from obstacles and critical collisions using either a circular robot point-check 
      # or full SE2 footprint check using the costmap values.        
      CostCritic:
        enabled: true
        # consider_footprint: False # Default: False. Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 3.81. Weight to apply to critic to avoid obstacles.
        cost_weight: 3.0
        # Default 300.0. Cost to apply to a pose with any point in in inflated space to prefer distance from obstacles.
        critical_cost: 300.0
        # Default: False. Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        consider_footprint: true
        # Default 1000000.0. Cost to apply to a true collision in a trajectory.
        collision_cost: 1000000.0
        # Default 0.5. Distance near goal to stop applying preferential obstacle term to allow robot to smoothly converge to goal
        #  pose in close proximity to obstacles.
        near_goal_distance: 0.5
        # inflation_layer_name: "" # Default "". Name of the inflation layer. If empty, it uses the last inflation layer in the costmap. 
        # If you have multiple inflation layers, you may want to specify the name of the layer to use.
        # Default 2. Step of trajectory points to evaluate for costs since otherwise so dense represents multiple points for a single costmap cell.
        trajectory_point_step: 2
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes aligning with the global path, if relevant. It does not implement path following behavior.
      PathAlignCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 3.0
        # Maximum proportion of the path that can be occupied before this critic is not considered to allow the obstacle and path follow critics
        # to avoid obstacles while following the path’s intent in presence of dynamic objects in the scene. Between 0-1 for 0-100%.
        max_path_occupancy_ratio: 0.35
        # The step to take in trajectories for evaluating them in the critic. Since trajectories are extremely dense, its unnecessary 
        # to evaluate each point and computationally expensive.
        trajectory_point_step: 4
        # Distance (m) between robot and goal to stop considering path alignment and allow goal critics to take over.
        threshold_to_consider: 0.8
        # Checks that the candidate trajectories are sufficiently far along their way tracking the path to apply the alignment critic. 
        # This ensures that path alignment is only considered when actually tracking the path, preventing awkward initialization motions 
        # preventing the robot from leaving the path to achieve the appropriate heading.
        offset_from_furthest: 20
        # Whether to consider path’s orientations in path alignment, which can be useful when paired with feasible smac planners to incentivize 
        # directional changes only where/when the smac planner requests them. If you want the robot to deviate and invert directions where 
        # the controller sees fit, keep as false. If your plans do not contain orientation information (e.g. navfn), keep as false.
        use_path_orientations: false
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivizes making progress along the path. This is what drives the robot forward along the path.
      PathFollowCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 8.0
        # Number of path points after furthest one any trajectory achieves to drive path tracking relative to.
        offset_from_furthest: 5
        # Distance (m) between robot and goal to stop considering path following and allow goal critics to take over. It is wise to start with 
        # this as being the same as your prediction horizon to have a clean hand-off with the goal critic.
        threshold_to_consider: 0.8
      # ----------------------------------------------------------------------------------------------------
      # This critic penalizes trajectories at a high relative angle to the path. This helps the robot make sharp turns when necessary 
      # due to large accumulated angular errors.
      PathAngleCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 2.2. Weight to apply to critic term.
        cost_weight: 2.0
        # Default 4. Number of path points after furthest one any trajectory achieves to compute path angle relative to.
        offset_from_furthest: 4
        # Default 0.5. Distance between robot and goal above which path angle cost stops being considered
        threshold_to_consider: 0.5
        # Default 0.785398. Angular distance between robot and goal above which path angle cost starts being considered
        max_angle_to_furthest: 0.1
        # Default 0 (Forward Preference). Enum type for mode of operations for the path angle critic depending on path input types and behavioral desires. 
        # 0: Forward Preference, penalizes high path angles relative to the robot's orientation to incentivize turning towards the path. 
        # 1: No directional preference, penalizes high path angles relative to the robot's orientation or mirrored orientation (e.g. reverse), which ever is less, 
        #          when a particular direction of travel is not preferable. 
        # 2: Consider feasible path orientation, when using a feasible path whereas the path points have orientation information (e.g. Smac Planners), 
        #           consider the path's requested direction of travel to penalize path angles such that the robot will follow the path in the requested direction.
        mode: 1

      # ----------------------------------------------------------------------------------------------------
      # This critic penalizes unnecessary ‘twisting’ with holonomic vehicles. It adds a constraint on the rotation angle to keep it consistent.  
      TwirlingCritic:
        enabled: true
        # Power order to apply to term.
        twirling_cost_power: 1
        # Weight to apply to critic term.
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: "base_footprint"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.16, -0.13], [0.16, 0.13], [-0.16, 0.13], [-0.16, -0.13]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 2.0
          inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.08
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.16, -0.13], [0.16, 0.13], [-0.16, 0.13], [-0.16, -0.13]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.08
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_server:
  ros__parameters:
    use_sim_time: True
    # Keep empty here; nav2_bringup rewrites this from the launch 'map' argument.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    # Maximum time in seconds to wait for map save operations to complete.
    save_map_timeout: 5.0
    # Map mode: trinary, scale, or raw
    mode: "trinary"
    # Probability threshold below which a cell is saved as free space.
    free_thresh: 0.25
    # Probability threshold above which a cell is saved as occupied.
    occupied_thresh: 0.65
    # Subscribe with transient local QoS so late joiners receive the latest map.
    map_subscribe_transient_local: True
    # Image format for map files: pgm, png, etc.
    image_format: "pgm"
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

#In general though, the following table is a good guide for the optimal planning plugin for different types of robot bases:
# Plugin Name                 Supported Robot Types
# NavFn Planner               Circular Differential, Circular Omnidirectional
# Smac Planner 2D             Circular Differential, Circular Omnidirectional
# Theta Star Planner          Circular Differential, Circular Omnidirectional
# Smac Hybrid-A* Planner      Non-circular or Circular Ackermann, Non-circular or Circular Legged
# Smac Lattice Planner        Non-circular Differential, Non-circular Omnidirectional, Arbitrary
# Since the planning problem is primarily driven by the robot type, the table accurately summarizes the advice to users 
# by the maintainers. Within the circular robot regime, the choice of planning algorithm is dependent on application and desirable behavior. 
# NavFn will typically make broad, sweeping curves; Theta* prefers straight lines and supports them at any angle; 
# and Smac 2D is essentially a classical A* algorithm with cost-aware penalties.
# The NavfnPlanner is a global planner plugin for the Nav2 Planner server. It implements the Navigation Function
#  planner with either A* or Dij. expansions. It is largely equivalent to its counterpart in ROS 1 Navigation. 
# The Navfn planner assumes a circular robot (or a robot that can be approximated as circular for the purposes 
# of global path planning) and operates on a weighted costmap.
# See https://docs.nav2.org/tuning/index.html for details
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac 2D global planner for circular differential/omni robots.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # Tolerance in meters between requested goal pose and end of path.
      tolerance: 0.35
      # Keep full-resolution planning for tighter indoor path quality.
      downsample_costmap: false
      downsampling_factor: 1
      # Stop conditions for planning loop.
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      # Higher values bias the global path toward lower-cost center space in corridors/corners.
      cost_travel_multiplier: 6.0
      # Whether to allow planning in unknown space.
      # Frontier exploration typically proposes goals near unknown boundaries, so a goal can easily 
      # end up in unknown/blocked cells from the planner’s perspective.
      # This is true for explore lite, because it generates goals in frontiers which are on the boundary of unknown space. 
      # If the planner does not allow unknown space, then it will see those goals as blocked and fail to generate a plan to them.
      # allow_unknown: true
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# The nav2_velocity_smoother is a package containing a lifecycle-component node for smoothing velocities sent by Nav2 to robot controllers. 
# The aim of this package is to implement velocity, acceleration, and deadband smoothing from Nav2 to reduce wear-and-tear on robot motors 
# and hardware controllers by smoothing out the accelerations/jerky movements that might be present with some local trajectory planners' control efforts.
# It supports differential drive and omnidirectional robot platforms primarily, but is applicable to ackermann as well with some interpretations of Twist. 
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0  # Rate to run smoother
    scale_velocities: false  # scale velocities proportionally if any axis is outside of acceleration range to follow same vector, if possible
    feedback: "OPEN_LOOP"  # Type of feedback for current speed. Open loop uses the last smoothed output. Closed loop uses robot odometry
    max_velocity: [0.5, 0.5, 2.5]  # Maximum velocities, ordered [Vx, Vy, Vw]
    min_velocity: [-0.5, -0.5, -2.5]  # Minimum velocities, ordered [Vx, Vy, Vw]
    deadband_velocity: [0.0, 0.0, 0.0]  # A deadband of velocities below which they should be zero-ed out for sending to the robot base controller, ordered [Vx, Vy, Vw]
    velocity_timeout: 1.0  # Time (s) after which if no new velocity commands are received to zero out and stop
    max_accel: [2.5, 2.5, 3.2]  # Maximum acceleration, ordered [Ax, Ay, Aw]
    max_decel: [-2.5, -2.5, -3.2]  # Maximum deceleration, ordered [Ax, Ay, Aw]
    odom_topic: "/odometry/filtered"  # Topic of odometry to use for estimating current velocities
    odom_duration: 0.1  # Period of time (s) to sample odometry information in for velocity estimation
    enable_stamped_cmd_vel: false # Whether to stamp the velocity. True uses TwistStamped. False uses Twist  

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15

loopback_simulator:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02

slam_toolbox:
  ros__parameters:
    # Time source for simulation/recorded playback.
    # Default: false | Range: {true,false} | Impact: true keeps SLAM synchronized to /clock.
    use_sim_time: True

    # ------------------------------
    # Core solver plugin parameters
    # ------------------------------
    # Nonlinear backend for pose-graph optimization.
    # Default: solver_plugins::CeresSolver | Range: {solver_plugins::CeresSolver, solver_plugins::SpaSolver, solver_plugins::G2oSolver} | Impact: changes optimizer speed/robustness.
    solver_plugin: solver_plugins::CeresSolver
    # Ceres linear system solver.
    # Default: SPARSE_NORMAL_CHOLESKY | Range: {SPARSE_NORMAL_CHOLESKY, SPARSE_SCHUR, ITERATIVE_SCHUR, CGNR} | Impact: major effect on optimization runtime and memory.
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Preconditioner for iterative linear solves.
    # Default: JACOBI | Range: {JACOBI, IDENTITY, SCHUR_JACOBI} | Impact: can improve convergence speed and stability.
    ceres_preconditioner: SCHUR_JACOBI
    # Trust-region strategy in Ceres.
    # Default: LEVENBERG_MARQUARDT | Range: {LEVENBERG_MARQUARDT, DOGLEG} | Impact: affects convergence behavior in difficult loop closures.
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    # Dogleg variant (used only when ceres_trust_strategy=DOGLEG).
    # Default: TRADITIONAL_DOGLEG | Range: {TRADITIONAL_DOGLEG, SUBSPACE_DOGLEG} | Impact: small runtime/robustness trade-off when DOGLEG is used.
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Robust loss function for outlier rejection.
    # Default: None | Range: {None, HuberLoss, CauchyLoss} | Impact: stronger outlier rejection can reduce false loop closures.
    ceres_loss_function: HuberLoss

    # ------------------------------
    # ROS interface / frame settings
    # ------------------------------
    # Odometry frame id.
    # Default: odom | Range: valid TF frame string | Impact: must match TF tree or scan matching fails.
    odom_frame: odom
    # Map frame id.
    # Default: map | Range: valid TF frame string | Impact: global map frame used by Nav2 and RViz.
    map_frame: map
    # Robot base frame id.
    # Default: base_footprint (upstream), often base_link in robot stacks | Range: valid TF frame string | Impact: wrong value causes transform lookup errors.
    base_frame: base_footprint
    # Laser scan topic (prefer absolute topic path).
    # Default: /scan | Range: valid topic name | Impact: wrong topic means no scans processed.
    scan_topic: /scan
    # slam_toolbox operating mode.
    # Default: mapping | Range: {mapping, localization} | Impact: localization avoids map growth and favors relocalization.
    mode: mapping
    # Published occupancy grid topic name.
    # Default: /map | Range: valid topic name | Impact: must align with consumers expecting the map topic.
    map_name: /map
    # Enable built-in map saver services/subscriptions.
    # Default: true | Range: {true,false} | Impact: disables map saver endpoints when false.
    use_map_saver: true
    # Enable Nav2 lifecycle bond integration.
    # Default: false | Range: {true,false} | Impact: set true when using lifecycle manager supervision.
    use_lifecycle_manager: false

    # ---------------------------------------
    # Startup pose-graph load / localization
    # ---------------------------------------
    # Serialized pose-graph file to load at startup.
    # Default: "" | Range: existing file path string | Impact: enables continued mapping/localization from prior session.
    map_file_name: ""
    # Starting pose [x, y, yaw] used with map_file_name.
    # Default: [] | Range: [] or [x,y,yaw] | Impact: improves startup relocalization when approximate pose is known.
    map_start_pose: [0.0, 0.0, 0.0]
    # Start from first node (dock) in loaded graph when no explicit map_start_pose is provided.
    # Default: false | Range: {true,false} | Impact: controls deterministic startup anchor for loaded maps.
    map_start_at_dock: false

    # ------------------------------
    # Runtime / timing parameters
    # ------------------------------
    # Enable verbose debug logs.
    # Default: false | Range: {true,false} | Impact: useful for tuning, but increases log volume/CPU.
    debug_logging: false
    # Process every Nth scan (scan throttling).
    # Default: 1 | Range: integer >= 1 | Impact: larger values reduce CPU but may degrade map quality.
    throttle_scans: 1
    # Message filter queue size for incoming scans.
    # Default: 1 | Range: integer >= 1 | Impact: larger queue tolerates latency but can increase delay.
    scan_queue_size: 1
    # Period for publishing map->odom transform; 0 disables publishing.
    # Default: 0.05 (upstream), common tuned value 0.02 | Range: >= 0.0 s | Impact: lower period gives fresher TF at higher CPU cost.
    transform_publish_period: 0.02
    # Occupancy map publication/update interval.
    # Default: 5.0 | Range: > 0.0 s | Impact: lower value yields fresher map output with more CPU usage.
    map_update_interval: 1.0
    # Output map resolution in meters/cell.
    # Default: 0.05 | Range: > 0.0 | Impact: smaller value gives finer detail with higher memory/CPU.
    resolution: 0.05
    # Minimum laser range used for rasterization/filtering.
    # Default: 0.0 (typical) | Range: >= sensor min range | Impact: too low accepts invalid near returns; too high removes valid close obstacles.
    min_laser_range: 0.1
    # Maximum laser range used for rasterization/filtering.
    # Default: 10.0 (sample), sensor-dependent | Range: <= sensor max range | Impact: too high introduces noisy far hits; too low truncates map extent.
    max_laser_range: 10.0
    # Minimum time between accepted scans.
    # Default: 0.0-0.5 (depends on config) | Range: >= 0.0 s | Impact: higher values reduce CPU and update rate.
    minimum_time_interval: 0.15
    # TF lookup timeout.
    # Default: 0.5 | Range: >= 0.0 s | Impact: higher values tolerate TF lag but can add processing latency.
    transform_timeout: 0.5
    # TF history buffer duration.
    # Default: 30.0 | Range: > 0.0 s | Impact: larger buffers help delayed lookups and bag replay at memory cost.
    tf_buffer_duration: 30.0
    # Process stack size override in bytes (read-only at runtime).
    # Default: 40000000 | Range: integer > 0 | Impact: larger value prevents serialization stack overflows on large maps.
    stack_size_to_use: 40000000
    # Keep interactive RViz editing caches in memory.
    # Default: false (upstream), often enabled in mapping configs | Range: {true,false} | Impact: true increases memory, enables richer interactive editing.
    enable_interactive_mode: true
    # Restamp map->odom TF with now() instead of scan stamp.
    # Default: false | Range: {true,false} | Impact: can reduce stale TF issues; may mask timestamp inconsistencies.
    restamp_tf: false

    # Pose covariance scaling for downstream fusion.
    # Default: 1.0 | Range: > 0.0 | Impact: higher values reduce downstream trust in scan-matched position.
    position_covariance_scale: 1.0
    # Yaw covariance scaling for downstream fusion.
    # Default: 1.0 | Range: > 0.0 | Impact: higher values reduce downstream trust in scan-matched heading.
    yaw_covariance_scale: 1.0
    # Use precise min distance/heading checks instead of faster approximations.
    # Default: false | Range: {true,false} | Impact: true improves trigger accuracy with slight compute overhead.
    check_min_dist_and_heading_precisely: false

    # ------------------------------
    # Scan matcher / graph controls
    # ------------------------------
    # Enable scan matching refinement on top of odometry.
    # Default: true | Range: {true,false} | Impact: disabling reduces CPU but significantly hurts map quality.
    use_scan_matching: true
    # Use scan barycenter pose estimate.
    # Default: true | Range: {true,false} | Impact: can improve matching stability on some sensor geometries.
    use_scan_barycenter: true
    # Minimum translation before processing next scan.
    # Default: 0.5 | Range: >= 0.0 m | Impact: lower value increases map detail and CPU.
    minimum_travel_distance: 0.10
    # Minimum heading change before processing next scan.
    # Default: 0.5 | Range: >= 0.0 rad | Impact: lower value increases rotational detail and CPU.
    minimum_travel_heading: 0.11
    # Number of scans retained in local buffer.
    # Default: 10 | Range: integer >= 1 | Impact: larger buffer helps loop opportunities but raises memory/compute.
    scan_buffer_size: 40
    # Maximum distance for scans to remain in local buffer.
    # Default: 10.0 | Range: > 0.0 m | Impact: larger values keep broader context and can slow matching.
    scan_buffer_maximum_scan_distance: 20.0
    # Fine match response threshold for linking scans.
    # Default: 0.1 | Range: typically 0.0-1.0 | Impact: higher values are stricter and reduce false links.
    link_match_minimum_response_fine: 0.2
    # Max distance between linked scans.
    # Default: 1.5 | Range: > 0.0 m | Impact: larger values permit wider links but can admit wrong associations.
    link_scan_maximum_distance: 1.5
    # Radius for loop-closure candidate search.
    # Default: 3.0 | Range: > 0.0 m | Impact: larger radius finds more loops but increases false-positive risk/CPU.
    # Increase this distance (e.g., to 5.0 or 8.0 meters). It sets the maximum distance threshold between a current pose and previous graph nodes to even consider them for loop closure.
    loop_search_maximum_distance: 5.0
    # Enable loop closure.
    # Default: true | Range: {true,false} | Impact: disabling speeds runtime but loses global consistency correction.
    do_loop_closing: true
    # Minimum chain length for loop closure evaluation.
    # Default: 10 | Range: integer >= 1 | Impact: higher values are safer but may miss short valid loops.
    loop_match_minimum_chain_size: 10
    # Coarse variance threshold before refinement.
    # Default: 3.0 | Range: > 0.0 | Impact: lower values are stricter and reduce dubious loop candidates.
    loop_match_maximum_variance_coarse: 3.0
    # Coarse response threshold before refinement.
    # Default: 0.35 | Range: typically 0.0-1.0 | Impact: higher values reject weak coarse loop matches.
    loop_match_minimum_response_coarse: 0.45
    # Fine response threshold for loop acceptance.
    # Default: 0.45 | Range: typically 0.0-1.0 | Impact: higher values reduce false loop closures.
    loop_match_minimum_response_fine: 0.55

    # Slightly decrease these thresholds (e.g., lower coarse to 0.35 and fine to 0.45) 
    # if the system fails to close loops. Lowering them makes the system less strict about 
    # accepting a loop closure constraint, which can help in environments where the scan 
    # matching is less reliable or the robot experiences more drift. 
    # However, be cautious as setting them too low can increase the risk of false positives 
    # in loop closure, which can degrade map quality.

    # ---------------------------------
    # Correlation search configuration
    # ---------------------------------
    # Correlation search grid size.
    # Default: 0.5 | Range: > 0.0 m | Impact: larger dimension improves capture range at higher CPU cost.
    correlation_search_space_dimension: 0.5
    # Correlation search grid resolution.
    # Default: 0.01 | Range: > 0.0 m | Impact: finer resolution improves precision but increases compute.
    correlation_search_space_resolution: 0.01
    # Smearing sigma for correlation response.
    # Default: 0.1 | Range: > 0.0 | Impact: larger values smooth noise but can blur sharp matches.
    correlation_search_space_smear_deviation: 0.1

    # Loop-closure correlation search grid size.
    # Default: 8.0 | Range: > 0.0 m | Impact: larger values tolerate larger drift with more compute.
    # Increase this value (e.g., from the default 8.0 to 12.0 or 15.0 meters). This dictates the size of the search window used to look for loop closure candidates.
    loop_search_space_dimension: 12.0
    # Loop-closure grid resolution.
    # Default: 0.05 | Range: > 0.0 m | Impact: finer resolution improves closure precision at CPU cost.
    loop_search_space_resolution: 0.05
    # Loop-closure response smearing sigma.
    # Default: 0.03 | Range: > 0.0 | Impact: tuning balances robustness vs sharpness for loop scoring.
    loop_search_space_smear_deviation: 0.03

    # ------------------------------
    # Matcher penalty / angle tuning
    # ------------------------------
    # Translation penalty away from odometric prior.
    # Default: 0.5 | Range: >= 0.0 | Impact: higher values trust odometry more.
    distance_variance_penalty: 0.15
    # Angular penalty away from odometric prior.
    # Default: 1.0 | Range: >= 0.0 | Impact: higher values constrain heading correction.
    angle_variance_penalty: 1.0
    # Fine matching angular search half-window.
    # Default: 0.00349 | Range: > 0.0 rad | Impact: wider range helps recover from drift but increases ambiguity.
    fine_search_angle_offset: 0.00349
    # Coarse matching angular search half-window.
    # Default: 0.349 | Range: > 0.0 rad | Impact: wider range aids large-rotation recovery at more CPU cost.
    coarse_search_angle_offset: 0.349
    # Coarse angular discretization step.
    # Default: 0.0349 | Range: > 0.0 rad | Impact: smaller step improves precision with higher compute.
    coarse_angle_resolution: 0.0349
    # Lower bound on angular penalty term.
    # Default: 0.9 | Range: > 0.0 | Impact: prevents unstable overconfidence in angular matches.
    minimum_angle_penalty: 0.9
    # Lower bound on distance penalty term.
    # Default: 0.5 | Range: > 0.0 | Impact: prevents unstable overconfidence in translational matches.
    minimum_distance_penalty: 0.5
    # Expand response search when no viable match is found.
    # Default: true | Range: {true,false} | Impact: improves robustness in hard scenes at extra compute.
    use_response_expansion: true

    # ----------------------------------------------
    # Optional experimental node-type-only parameters
    # ----------------------------------------------
    # Enable KD-tree-assisted lifelong search (lifelong node only).
    # Default: false | Range: {true,false} | Impact: can improve lifelong association scalability.
    lifelong_search_use_tree: false
    # Minimum score to accept lifelong candidate.
    # Default: 0.10 | Range: 0.0-1.0 | Impact: higher value is stricter and reduces false lifelong links.
    lifelong_minimum_score: 0.10
    # IoU threshold for lifelong match acceptance.
    # Default: 0.85 | Range: 0.0-1.0 | Impact: higher threshold favors conservative node reuse.
    lifelong_iou_match: 0.85
    # Score threshold for lifelong node removal.
    # Default: 0.10 | Range: 0.0-1.0 | Impact: higher value prunes nodes more aggressively.
    lifelong_node_removal_score: 0.10
    # Overlap score scaling in lifelong optimization.
    # Default: 0.5 | Range: >= 0.0 | Impact: tunes weight of overlap term when pruning/keeping nodes.
    lifelong_overlap_score_scale: 0.5
    # Constraint multiplier for lifelong graph terms.
    # Default: 0.05 | Range: >= 0.0 | Impact: larger values increase lifelong constraint influence.
    lifelong_constraint_multiplier: 0.05
    # Nearby candidate penalty for lifelong mode.
    # Default: 0.001 | Range: >= 0.0 | Impact: higher values discourage very-near duplicate insertions.
    lifelong_nearby_penalty: 0.001
    # Candidate scaling factor for lifelong selection.
    # Default: 0.03 | Range: >= 0.0 | Impact: changes number/distribution of lifelong candidates.
    lifelong_candidates_scale: 0.03

    # Start map-and-localization node in localization mode (map_and_localization node only).
    # Default: false | Range: {true,false} | Impact: true skips immediate mapping expansion on startup.
    localization_on_configure: false

    # Decentralized multi-robot scan sharing topic (decentralized node only).
    # Default: /localized_scan | Range: valid topic name | Impact: controls inter-robot scan exchange channel.
    scan_share_topic: /localized_scan

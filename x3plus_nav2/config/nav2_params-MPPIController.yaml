# Parameter reference:
# config/nav2_params-MPPIController.reference.md

slam_toolbox:
  ros__parameters:

    # --- Solver ---
    # solver_plugin: Nonlinear least-squares back-end used to optimise the pose graph.
    #   Description: CeresSolver is the most robust and feature-rich option.
    #   Impact:       Affects convergence speed and pose-graph accuracy.
    #   Default:      solver_plugins::CeresSolver
    #   Options:      solver_plugins::CeresSolver | solver_plugins::SpaSolver | solver_plugins::G2oSolver
    solver_plugin: solver_plugins::CeresSolver

    # ceres_linear_solver: Linear algebra back-end used inside each Ceres iteration.
    #   Description: SPARSE_NORMAL_CHOLESKY is fast and memory-efficient for sparse pose graphs.
    #   Impact:       DENSE_QR is more accurate but slower; SPARSE_NORMAL_CHOLESKY is the practical default.
    #   Default:      SPARSE_NORMAL_CHOLESKY
    #   Options:      SPARSE_NORMAL_CHOLESKY | DENSE_QR | DENSE_NORMAL_CHOLESKY | CGNR | SPARSE_SCHUR | ITERATIVE_SCHUR
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY

    # ceres_preconditioner: Preconditioner applied when using iterative linear solvers.
    #   Description: SCHUR_JACOBI is efficient for structure-from-motion style graphs typical in SLAM.
    #   Impact:       Better preconditioner → fewer CG iterations → faster solve.
    #   Default:      SCHUR_JACOBI
    #   Options:      IDENTITY | JACOBI | SCHUR_JACOBI | CLUSTER_JACOBI | CLUSTER_TRIDIAGONAL
    ceres_preconditioner: SCHUR_JACOBI

    # ceres_trust_strategy: Strategy Ceres uses to control the step size during optimisation.
    #   Description: LEVENBERG_MARQUARDT is more stable in early iterations; DOGLEG can be faster when near optimum.
    #   Impact:       Affects convergence stability and speed.
    #   Default:      LEVENBERG_MARQUARDT
    #   Options:      LEVENBERG_MARQUARDT | DOGLEG
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # ceres_dogleg_type: Sub-type used when trust strategy is DOGLEG.
    #   Description: TRADITIONAL_DOGLEG is simpler; SUBSPACE_DOGLEG can be more accurate.
    #   Impact:       Only active when ceres_trust_strategy: DOGLEG.
    #   Default:      TRADITIONAL_DOGLEG
    #   Options:      TRADITIONAL_DOGLEG | SUBSPACE_DOGLEG
    ceres_dogleg_type: TRADITIONAL_DOGLEG

    # ceres_loss_function: Robust kernel applied to residuals to reduce influence of outlier matches.
    #   Description: None means standard L2 (least squares). Huber or Cauchy reduce outlier sensitivity.
    #   Impact:       Robust kernels improve map quality in noisy or dynamic environments at a small speed cost.
    #   Default:      None
    #   Options:      None | HuberLoss | CauchyLoss
    ceres_loss_function: None

    # --- Frames & Topics ---
    # odom_frame: TF frame published by the odometry source.
    #   Default: odom
    odom_frame: odom

    # map_frame: TF frame of the SLAM-generated map.
    #   Default: map
    map_frame: map

    # base_frame: TF frame of the robot footprint / base.
    #   Default: base_link
    base_frame: base_link

    # scan_topic: Laser scan topic to subscribe to.
    #   Default: /scan
    scan_topic: /scan

    # mode: Operating mode of slam_toolbox.
    #   Description: mapping builds a new map; localization localises on an existing map; lifelong continues updating a saved map.
    #   Default:      mapping
    #   Options:      mapping | localization | lifelong
    mode: mapping

    # --- General ---
    # debug_logging: Enable verbose debug output.
    #   Impact:  High log volume, for development only.
    #   Default: false | Range: true / false
    debug_logging: false

    # throttle_scans: Process every Nth scan (1 = every scan).
    #   Description: Reduces CPU load at the cost of fewer scan nodes.
    #   Impact:  Higher value → fewer nodes, coarser map; lower → richer map but more CPU.
    #   Default: 1 | Range: 1–10 (integer)
    throttle_scans: 1

    # transform_publish_period: Interval (s) at which the map→odom TF is re-published.
    #   Impact:  Too large causes TF stuttering in navigation; too small wastes CPU.
    #   Default: 0.02 | Range: 0.01–0.1
    transform_publish_period: 0.02

    # map_update_interval: Interval (s) at which the occupancy-grid map is regenerated for visualisation / nav.
    #   Impact:  Lower = map consumers (Nav2 costmaps, RViz) see updates sooner; higher = less CPU.
    #            Does NOT affect how often scan nodes are added to the pose graph.
    #   Default: 5.0 | Range: 0.5–10.0
    map_update_interval: 2.0

    # resolution: Cell size (m) of the 2-D occupancy map.
    #   Impact:  Lower = sharper walls and features; higher = coarser but faster rasterisation and smaller map.
    #            Reducing below the sensor noise floor gives no further benefit.
    #   Default: 0.05 | Range: 0.02–0.10
    resolution: 0.05

    # max_laser_range: Maximum range (m) of laser returns used for scan matching and map rasterisation.
    #   Description: Clips long-range returns that are typically noisiest. Should stay at or below the sensor's reliable range.
    #   Impact:  Lower = fewer noisy constraints and sharper near-field walls; higher = more coverage but weaker matches.
    #   Default: 25.0 | Range: 2.0–30.0 (must not exceed sensor max)
    max_laser_range: 12.0

    # minimum_time_interval: Minimum time (s) that must pass before a new scan is accepted.
    #   Description: Throttles scan intake regardless of motion. Useful to cap CPU when the sensor publishes faster than needed.
    #   Impact:  Lower = more scans processed, better map density; higher = fewer scans, lower CPU.
    #   Default: 0.5 | Range: 0.0–2.0
    minimum_time_interval: 0.3

    # transform_timeout: How long (s) to wait for a TF transform before giving up.
    #   Impact:  Too low → dropped scans on a busy system; too high → latency.
    #   Default: 0.2 | Range: 0.05–1.0
    transform_timeout: 0.2

    # tf_buffer_duration: Size (s) of the TF history buffer.
    #   Impact:  Must be larger than the maximum expected TF lookup age. Larger values use more memory.
    #   Default: 30.0 | Range: 5.0–120.0
    tf_buffer_duration: 30.

    # stack_size_to_use: Thread stack size (bytes) allocated for the solver.
    #   Impact:  Increase if you see stack-overflow crashes with large maps. 40 MB is sufficient for most use cases.
    #   Default: 40000000 | Range: 10000000–80000000
    stack_size_to_use: 40000000

    # enable_interactive_mode: Expose the interactive map manipulation service.
    #   Impact:  Allows manual loop-closure corrections via RViz plugin; small constant overhead.
    #   Default: false | Range: true / false
    enable_interactive_mode: true

    # --- Scan Matching ---
    # use_scan_matching: Use ICP/scan-correlation matching to refine odometric pose before adding a node.
    #   Impact:  true = much better map consistency; false = relies solely on odometry (not recommended).
    #   Default: true | Range: true / false
    use_scan_matching: true

    # use_scan_barycenter: Place the scan node at the centroid of the scan points rather than the sensor origin.
    #   Impact:  Slightly more robust node placement in open areas.
    #   Default: true | Range: true / false
    use_scan_barycenter: true

    # minimum_travel_distance: Minimum linear distance (m) the robot must travel before a new scan node is created.
    #   Impact:  Lower = denser pose graph and more accurate maps; higher = fewer nodes and lower CPU.
    #   Default: 0.5 | Range: 0.05–1.0
    minimum_travel_distance: 0.35

    # minimum_travel_heading: Minimum angular change (rad) before a new scan node is created.
    #   Impact:  Lower = captures rotation more accurately; higher = fewer nodes on turning motions.
    #   Default: 0.5 | Range: 0.05–1.0
    minimum_travel_heading: 0.35

    # scan_buffer_size: Number of recent scans kept in the local chain used for scan matching.
    #   Impact:  Larger buffer = better local match quality and loop-closure context; higher memory use.
    #   Default: 10 | Range: 5–50
    scan_buffer_size: 10

    # scan_buffer_maximum_scan_distance: Discard buffered scans farther than this distance (m) from the current position.
    #   Impact:  Keeps the buffer spatially local; should align with max_laser_range.
    #   Default: 10.0 | Range: 1.0–30.0
    scan_buffer_maximum_scan_distance: 12.0

    # link_match_minimum_response_fine: Minimum correlation score (0–1) for the fine-resolution scan matcher to accept a link.
    #   Impact:  Higher = fewer but more reliable links; lower = more links but risk of false associations.
    #            Increase first when you see ghosting or doubled walls.
    #   Default: 0.1 | Range: 0.0–1.0
    link_match_minimum_response_fine: 0.1

    # link_scan_maximum_distance: Maximum distance (m) between two nodes to attempt linking.
    #   Impact:  Lower = only close, well-overlapping scans are linked (more reliable); higher = longer-range links (more constraints, higher risk).
    #   Default: 1.5 | Range: 0.5–5.0
    link_scan_maximum_distance: 1.5

    # --- Loop Closure ---
    # loop_search_maximum_distance: Radius (m) around the current pose to search for loop-closure candidates.
    #   Impact:  Larger = more closure opportunities; smaller = less CPU and fewer false positives.
    #   Default: 3.0 | Range: 1.0–15.0
    loop_search_maximum_distance: 3.0

    # do_loop_closing: Enable loop closure detection and correction.
    #   Impact:  true = corrects accumulated drift; false = open-loop SLAM (map drifts over time).
    #   Default: true | Range: true / false
    do_loop_closing: true

    # loop_match_minimum_chain_size: Minimum number of consecutive nodes that must agree before a loop is closed.
    #   Impact:  Higher = fewer false loop closures; lower = more agressive loop closing with higher false-positive risk.
    #   Default: 10 | Range: 3–20 (integer)
    loop_match_minimum_chain_size: 10

    # loop_match_maximum_variance_coarse: Maximum covariance allowed for the coarse loop candidate to pass to fine matching.
    #   Impact:  Higher = looser pre-filter (more candidates reach fine stage); lower = stricter.
    #   Default: 3.0 | Range: 0.1–9.0
    loop_match_maximum_variance_coarse: 3.0

    # loop_match_minimum_response_coarse: Minimum score (0–1) for the coarse-stage loop candidate to be promoted to fine matching.
    #   Impact:  Higher = stricter candidate filtering, fewer false loop closures; lower = more permissive.
    #   Default: 0.35 | Range: 0.0–1.0
    loop_match_minimum_response_coarse: 0.35

    # loop_match_minimum_response_fine: Minimum score (0–1) for the fine-stage loop closure to be accepted into the pose graph.
    #   Impact:  Higher = only high-confidence closures are accepted; lower = more closures but risk of bad corrections.
    #            Increase when you see sudden map jumps.
    #   Default: 0.45 | Range: 0.0–1.0
    loop_match_minimum_response_fine: 0.45

    # --- Correlation Search Space (scan-to-scan matching) ---
    # correlation_search_space_dimension: Side length (m) of the search grid used during scan correlation.
    #   Impact:  Larger covers more odometry error but is slower; smaller is faster but may miss the true match.
    #   Default: 0.5 | Range: 0.1–2.0
    correlation_search_space_dimension: 0.5

    # correlation_search_space_resolution: Grid cell size (m) of the correlation search space.
    #   Impact:  Finer = more accurate position estimate; coarser = faster. Should be ≤ map resolution.
    #   Default: 0.01 | Range: 0.005–0.05
    correlation_search_space_resolution: 0.01

    # correlation_search_space_smear_deviation: Gaussian smear (m) applied to scan points before correlation.
    #   Impact:  Higher = more forgiving to small misalignments but blurs map; lower = sharper matching.
    #   Default: 0.1 | Range: 0.01–0.3
    correlation_search_space_smear_deviation: 0.1

    # --- Loop Search Space ---
    # loop_search_space_dimension: Side length (m) of the search grid used during loop-closure scan matching.
    #   Impact:  Larger handles bigger positional uncertainty at loop detection; slower.
    #   Default: 8.0 | Range: 2.0–20.0
    loop_search_space_dimension: 8.0

    # loop_search_space_resolution: Grid cell size (m) of the loop-closure search space.
    #   Impact:  Finer = more accurate loop alignment; coarser = faster.
    #   Default: 0.05 | Range: 0.01–0.1
    loop_search_space_resolution: 0.05

    # loop_search_space_smear_deviation: Gaussian smear (m) applied during loop-closure scan matching.
    #   Impact:  Higher = more tolerant of partial overlaps; lower = sharper loop constraints.
    #   Default: 0.03 | Range: 0.005–0.1
    loop_search_space_smear_deviation: 0.03

    # --- Penalty / Cost Tuning ---
    # distance_variance_penalty: Weight applied to distance uncertainty in the pose-graph cost.
    #   Impact:  Higher = constraints with large translational uncertainty are penalised more strongly.
    #   Default: 0.5 | Range: 0.1–2.0
    distance_variance_penalty: 0.5

    # angle_variance_penalty: Weight applied to angular uncertainty in the pose-graph cost.
    #   Impact:  Higher = angular errors are penalised more; useful when rotation is the dominant error source.
    #   Default: 1.0 | Range: 0.1–5.0
    angle_variance_penalty: 1.0

    # fine_search_angle_offset: Half-range (rad) of the angular search during fine scan matching.
    #   Impact:  Smaller = faster but may miss true rotation if odometry heading is poor.
    #   Default: 0.00349 (~0.2°) | Range: 0.00175–0.01745
    fine_search_angle_offset: 0.00349

    # coarse_search_angle_offset: Half-range (rad) of the angular search during coarse scan matching.
    #   Impact:  Larger = handles more heading uncertainty; smaller = faster.
    #   Default: 0.349 (~20°) | Range: 0.1–0.785
    coarse_search_angle_offset: 0.349

    # coarse_angle_resolution: Angular step size (rad) used in the coarse angular search.
    #   Impact:  Smaller = finer angular search, better accuracy but slower; larger = faster but coarser.
    #   Default: 0.0349 (~2°) | Range: 0.00873–0.0698
    coarse_angle_resolution: 0.0349

    # minimum_angle_penalty: Minimum multiplicative penalty applied for angular deviation (0–1).
    #   Impact:  Prevents the solver from completely ignoring angular constraints even at small angles.
    #   Default: 0.9 | Range: 0.0–1.0
    minimum_angle_penalty: 0.9

    # minimum_distance_penalty: Minimum multiplicative penalty applied for translational deviation (0–1).
    #   Impact:  Floor on the distance penalty; prevents very close scans from being weighted too loosely.
    #   Default: 0.5 | Range: 0.0–1.0
    minimum_distance_penalty: 0.5

    # use_response_expansion: Expand the search space when the initial correlation response is low.
    #   Impact:  true = more robust recovery from poor initial estimates; slight extra CPU cost.
    #   Default: true | Range: true / false
    use_response_expansion: true

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 16.0
    laser_min_range: 0.01
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # The fully-qualified type of the plugin class. Options are “nav2_amcl::DifferentialMotionModel” 
    # and “nav2_amcl::OmniMotionModel”. Users can also provide their own custom motion model plugin type.
    # robot_model_type: "nav2_amcl::DifferentialMotionModel"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # This increases the TF buffer size to 5 seconds, which helps prevent transform extrapolation issues.
    tf_buffer_duration: 5.0  # Duration in seconds
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Setting pose (29.350000): 0.019 0.003 0.000

    set_initial_pose: true
    always_reset_initial_pose: true

    initial_pose:
      x: 0.019 
      y: .003
      z: 0.0
      yaw: 0.0 #yaw: 1.615

bt_navigator:
  ros__parameters:

    # --- General ---
    # use_sim_time: Use simulation clock.
    #   Default: false | Range: true / false
    use_sim_time: True

    # global_frame: The global fixed frame for navigation.
    #   Default: map
    global_frame: map

    # robot_base_frame: The robot base TF frame.
    #   Default: base_link
    robot_base_frame: base_link

    # odom_topic: Odometry topic used by the BT navigator for velocity context.
    #   Default: odom
    odom_topic: "/odometry/filtered"

    # --- Timing ---
    # bt_loop_duration: Duration (ms) of each Behaviour Tree tick loop.
    #   Impact:  Lower = more responsive navigation decisions; higher = lower CPU.
    #   Default: 10 | Range: 5–100 (integer ms)
    bt_loop_duration: 10

    # default_server_timeout: Default timeout (ms) for action server responses within BTs.
    #   Impact:  Increase if planning or control servers are slow to respond on first call.
    #   Default: 20 | Range: 10–1000 (integer ms)
    default_server_timeout: 20

    # wait_for_service_timeout: Timeout (ms) to wait for action/service servers at startup.
    #   Impact:  Increase on slow systems to prevent premature startup failure.
    #   Default: 1000 | Range: 100–30000 (integer ms)
    wait_for_service_timeout: 1000

    # action_server_result_timeout: Timeout (s) to wait for a navigation action result before failing.
    #   Impact:  Increase for very long navigation tasks in large environments.
    #   Default: 900.0 | Range: 10.0–3600.0
    action_server_result_timeout: 900.0

    # navigators: List of navigator plugins to load.
    #   Default: ["navigate_to_pose", "navigate_through_poses"]
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # Default BT XMLs are navigate_to_pose_w_replanning_and_recovery and
    # navigate_through_poses_w_replanning_and_recovery. Override via
    # 'default_nav_to_pose_bt_xml' / 'default_nav_through_poses_bt_xml' params
    # or via a RewrittenYaml remap from a parent launch file.

    # error_code_names: Action server error codes to propagate for diagnostics.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:

    # --- General ---
    # use_sim_time: Use simulation clock.
    #   Default: false | Range: true / false
    use_sim_time: True

    # controller_frequency: Rate (Hz) at which the controller server runs.
    #   Impact:  Higher = smoother control; higher CPU. Should equal 1 / model_dt in MPPI.
    #   Default: 20.0 | Range: 5.0–50.0
    controller_frequency: 20.0

    # costmap_update_timeout: Maximum time (s) to wait for a fresh costmap before aborting control.
    #   Impact:  Increase on slow systems; decrease for tighter real-time response.
    #   Default: 0.30 | Range: 0.1–1.0
    costmap_update_timeout: 0.30

    # min_x/y/theta_velocity_threshold: Velocities below these values (m/s or rad/s) are treated as zero.
    #   Impact:  Prevents noisy near-zero velocities from triggering unnecessary control actions.
    #            Set near encoder resolution or odometry noise floor.
    #   Default: 0.001 | Range: 0.0–0.1
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    # failure_tolerance: Number of consecutive controller failures tolerated before declaring failure.
    #   Impact:  Higher = more lenient; lower = faster failure detection and recovery trigger.
    #   Default: 0.3 | Range: 0.0–5.0
    failure_tolerance: 1.0

    # progress_checker_plugins: List of progress checker plugin names to load.
    progress_checker_plugins: ["progress_checker"]

    # goal_checker_plugins: List of goal checker plugin names to load.
    goal_checker_plugins: ["general_goal_checker"]

    # controller_plugins: List of controller plugins (one per named path follower).
    controller_plugins: ["FollowPath"]

    # use_realtime_priority: Elevate the controller thread to real-time OS scheduling priority.
    #   Impact:  Reduces control jitter on real hardware; requires SCHED_FIFO OS permissions.
    #   Default: false | Range: true / false
    use_realtime_priority: false

    # odom_topic: Odometry topic the controller server uses for velocity feedback.
    odom_topic: "/odometry/filtered"


    # --- Progress Checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: Minimum distance (m) the robot must move within movement_time_allowance to be considered making progress.
      #   Impact:  Too high = premature failure on slow robots or tight spaces; too low = misses stuck condition.
      #   Default: 0.5 | Range: 0.05–1.0
      required_movement_radius: 0.10
      # movement_time_allowance: Time window (s) in which required_movement_radius must be achieved.
      #   Impact:  Increase for slow robots or high-latency planners.
      #   Default: 10.0 | Range: 5.0–60.0
      movement_time_allowance: 20.0

    # --- Goal Checker ---
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # xy_goal_tolerance: Cartesian distance (m) from goal position to consider it reached.
      #   Impact:  Lower = more precise stopping; higher = allows robot to stop slightly early.
      #   Default: 0.25 | Range: 0.05–0.5
      xy_goal_tolerance: 0.3
      # yaw_goal_tolerance: Angular tolerance (rad) from goal heading to consider it reached.
      #   Impact:  Lower = stricter heading alignment at goal; higher = any orientation accepted.
      #   Default: 0.25 | Range: 0.05–3.14
      yaw_goal_tolerance: 0.25
    # The most common parameters you might want to start off changing are the velocity profiles (vx_max, vx_min, wz_max, and vy_max if holonomic) 
    # and the motion_model to correspond to your vehicle. Its wise to consider the prune_distance of the path plan in proportion to your maximum 
    # velocity and prediction horizon. The only deeper parameter that will likely need to be adjusted for your particular settings is the Obstacle critics’ 
    # repulsion_weight since the tuning of this is proportional to your inflation layer’s radius. Higher radii should correspond to reduced repulsion_weight 
    # due to the penalty formation (e.g. inflation_radius - min_dist_to_obstacle). If this penalty is too high, the robot will slow significantly 
    # when entering cost-space from non-cost space or jitter in narrow corridors. It is noteworthy, but likely not necessary to be changed, 
    # that the Obstacle critic may use the full footprint information if consider_footprint = true, though comes at an increased compute cost.      
    # Prediction Horizon, Costmap Sizing, and Offsets
    # As this is a predictive planner, there is some relationship between maximum speed, prediction times, and costmap size that users should keep
    #  in mind while tuning for their application. If a controller server costmap is set to 3.0m in size, that means that with the robot in the center, 
    # there is 1.5m of information on either side of the robot. When your prediction horizon (time_steps * model_dt) at maximum speed (vx_max) is larger than this, 
    # then your robot will be artificially limited in its maximum speeds and behavior by the costmap limitation. 
    # For example, if you predict forward 3 seconds (60 steps @ 0.05s per step) at 0.5m/s maximum speed, the minimum required costmap radius is 1.5m - or 3m total width.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Default 56. Number of time steps (points) in each sampled trajectory
      time_steps: 56
      # Default: 0.05. Time interval (s) between two sampled points in trajectories.
      # The model_dt parameter generally should be set to the duration of your control frequency. So if your control frequency is 20hz, 
      # this should be 0.05. However, you may also set it lower but not larger.
      model_dt: 0.05
      # Default 1000. Count of randomly sampled candidate trajectories
      batch_size: 2000
      # Maximum forward acceleration (m/s^2).
      ax_max: 3.0
      # Maximum deceleration along the X-axis (m/s^2).
      ax_min: -3.0
      # Maximum lateral acceleration in either direction, if using Omni motion model (m/s^2).
      ay_max: 3.0
      # Maximum angular acceleration (rad/s^2).
      az_max: 3.5
      # Default 0.2. Sampling standard deviation for VX
      vx_std: 0.2
      # Default 0.2. Sampling standard deviation for VY
      vy_std: 0.2
      # Default 0.4. Sampling standard deviation for Wz
      # This parameter controls the standard deviation for the angular velocity sampling. By adjusting this, you can influence 
      # how much rotational variation is considered during trajectory sampling.
      wz_std: 3.2
      # Default 0.5. Max VX (m/s)
      vx_max: 0.5
      # Default -0.35. Min VX (m/s)
      vx_min: -0.35
      # Default 0.5. Max VY in either direction, if holonomic. (m/s)
      vy_max: 0.25
      # Default 1.9. Max WZ (rad/s)
      # wz_max: 1.9
      wz_max: 1.9
      # Default 1. Iteration count in MPPI algorithm. Recommend to keep as 1 and prefer more batches.
      iteration_count: 1
      # Default: 0.3. Selectiveness of trajectories by their costs (The closer this value to 0, the "more" 
      # we take in consideration controls with less cost), 0 mean use control with best cost, huge value will lead to just taking
      #  mean of all trajectories without cost consideration
      temperature: 0.3
      # Default: 0.015. A trade-off between smoothness (high) and low energy (low). This is a complex parameter that likely won't
      #  need to be changed from the default of 0.1 which works well for a broad range of cases. See Section 3D-2 in "Information 
      # Theoretic Model Predictive Control: Theory and Applications to Autonomous Driving" for detailed information.
      gamma: 0.015
      # Default: DiffDrive. Type of model [DiffDrive, Omni, Ackermann].
      motion_model: "DiffDrive"
      # Default: false. Publish visualization of trajectories, which can slow down the controller significantly. Use only for debugging.
      # Visualization of the trajectories using visualize uses compute resources to back out trajectories for visualization and therefore slows compute time. 
      # It is not suggested that this parameter is set to true during a deployed use, but is a useful debug instrument while tuning the system, 
      # but use sparingly. Visualizing 2000 batches @ 56 points at 30 hz is a lot.
      # @open
      visualize: true 
      # 	Default false. Whether to regenerate noises each iteration or use single noise distribution computed on initialization and reset. 
      # Practically, this is found to work fine since the trajectories are being sampled stochastically from a normal distribution and 
      # reduces compute jittering at run-time due to thread wake-ups to resample normal distribution.
      regenerate_noises: true
      # Path Handler
      # Default: 1.5. Distance ahead of nearest point on path to robot to prune path to.
      prune_distance: 1.7
      # Default: 0.1. Time tolerance for data transformations with TF.
      transform_tolerance: 0.1
      # max_robot_pose_search_dist	double	Default: Costmap half-size. Max integrated distance ahead of robot pose to search for nearest path point in case of path looping.
      # enforce_path_inversion	double	Default: False. If true, it will prune paths containing cusping points for segments changing directions 
      #   (e.g. path inversions) such that the controller will be forced to change directions at or very near the planner's requested inversion point. 
      #    This is targeting Smac Planner users with feasible paths who need their robots to switch directions where specifically requested.
      # inversion_xy_tolerance	double	Default: 0.2. Cartesian proximity (m) to path inversion point to be considered "achieved" to pass on the rest of the path after path inversion.
      # inversion_yaw_tolerance	double	Default: 0.4. Angular proximity (radians) to path inversion point to be considered "achieved" to pass on the rest of the path after path inversion. 0.4 rad = 23 deg.
      TrajectoryVisualizer:
        # Default: 5. The step between trajectories to visualize to downsample candidate trajectory pool.
        trajectory_step: 5
        # 	Default: 3. The step between points on trajectories to visualize to downsample trajectory density.
        time_step: 3
      AckermannConstraints:
        # minimum turning radius for ackermann motion model
        min_turning_r: 0.5
      # Default: None. Critics (plugins) names
      critics: [
        "ConstraintCritic", "ObstaclesCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize navigating away from obstacles and critical collisions using either a circular
      #  robot point-check or full SE2 footprint check using distances from obstacles.
      ObstaclesCritic:
        # Weight to apply to critic for near collisions closer than collision_margin_distance to prevent near collisions only 
        # as a method of virtually inflating the footprint. This should not be used to generally influence obstacle avoidance away from critical collisions.
        critical_weight: 20.0
        # Weight to apply to critic for generally preferring routes in lower cost space. This is separated from the critical term to allow
        #  for fine tuning of obstacle behaviors with path alignment for dynamic scenes without impacting actions which may directly lead to near-collisions. 
        # This is applied within the inflation_radius distance from obstacles.
        # Increased for stronger wall avoidance at 0.3m clearance
        repulsion_weight: 1.0
        # Power order to apply to term.
        cost_power: 1
        # Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        consider_footprint: true
        # Cost to apply to a true collision in a trajectory.
        collision_cost: 100000.0
        # Margin distance (m) from collision to apply severe penalty, similar to footprint inflation. Between 0.05-0.2 is reasonable. 
        # Note that it will highly influence the controller not to enter spaces more confined than this, so ensure this parameter 
        # is set lower than the narrowest you expect the robot to need to traverse through.
        collision_margin_distance: 0.08
        # Distance (m) near goal to stop applying preferential obstacle term to allow robot to smoothly converge to goal pose in close proximity to obstacles
        near_goal_distance: 0.70
        # Exponential decay factor across inflation radius. This should be the same as for your inflation layer (Humble only)
        cost_scaling_factor: 3.0
        # Radius to inflate costmap around lethal obstacles. This should be the same as for your inflation layer (Humble only)
        # Set to 0.3m for desired wall clearance
        inflation_radius: 0.3
        # Name of the inflation layer. If empty, it uses the last inflation layer in the costmap. If you have multiple inflation layers, 
        # you may want to specify the name of the layer to use.'
        # inflation_layer_name: ""
      # ----------------------------------------------------------------------------------------
      # This critic penalizes trajectories that have components outside of the set dynamic or kinematic constraints
      ConstraintCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 4.0. Weight to apply to critic term.
        cost_weight: 4.0
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize navigating spatially towards the goal when in reasonable proximity to goal
      GoalCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 5.0. Weight to apply to critic term.
        cost_weight: 8.0
        # Default 1.4. Distance between robot and goal above which goal cost starts being considered
        # It is wise to start with this as being the same as your prediction horizon to have a clean hand-off with the path follower critic.
        threshold_to_consider: 0.8
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize navigating to achieve the angle of the goal pose when in reasonable proximity to goal
      GoalAngleCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 3.0. Weight to apply to critic term.
        cost_weight: 3.0
        # Default 0.5. Minimal distance between robot and goal above which angle goal cost considered.
        # There is a correlation to the goal checker, because it might rotate to the target angle too aggressively
        # outside the    general_goal_checker:  xy_goal_tolerance: 0.25 distance when rotating parameter wz_std: 3.2
        # has high values. Setting this below tolerance
        threshold_to_consider: 0.2
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize moving in the forward direction, rather than reversing.
      PreferForwardCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 5.0
        # Distance (m) between robot and goal to stop considering preferring forward and allow goal critics to take over.
        threshold_to_consider: 0.5
      # ----------------------------------------------------------------------------------------------------
      # Uses inflated costmap cost directly to avoid obstacles
      # This critic incentivize navigating away from obstacles and critical collisions using either a circular robot point-check 
      # or full SE2 footprint check using the costmap values.        
      CostCritic:
        enabled: true
        # consider_footprint: False # Default: False. Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 3.81. Wight to apply to critic to avoid obstacles.
        cost_weight: 1.0
        # Default 300.0. Cost to apply to a pose with any point in in inflated space to prefer distance from obstacles.
        critical_cost: 300.0
        # Default: False. Whether to use point cost (if robot is circular or low compute power) or compute SE2 footprint cost.
        consider_footprint: true
        # Default 1000000.0. Cost to apply to a true collision in a trajectory.
        collision_cost: 1000000.0
        # Default 0.5. Distance near goal to stop applying preferential obstacle term to allow robot to smoothly converge to goal
        #  pose in close proximity to obstacles.
        near_goal_distance: 0.5
        # inflation_layer_name: "" # Default "". Name of the inflation layer. If empty, it uses the last inflation layer in the costmap. 
        # If you have multiple inflation layers, you may want to specify the name of the layer to use.
        # Default 2. Step of trajectory points to evaluate for costs since otherwise so dense represents multiple points for a single costmap cell.
        trajectory_point_step: 2
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize aligning with the global path, if relevant. It does not implement path following behavior.
      PathAlignCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 3.0
        # Maximum proportion of the path that can be occupied before this critic is not considered to allow the obstacle and path follow critics
        # to avoid obstacles while following the path’s intent in presence of dynamic objects in the scene. Between 0-1 for 0-100%.
        max_path_occupancy_ratio: 0.35
        # The step to take in trajectories for evaluating them in the critic. Since trajectories are extremely dense, its unnecessary 
        # to evaluate each point and computationally expensive.
        trajectory_point_step: 4
        # Distance (m) between robot and goal to stop considering path alignment and allow goal critics to take over.
        threshold_to_consider: 0.8
        # Checks that the candidate trajectories are sufficiently far along their way tracking the path to apply the alignment critic. 
        # This ensures that path alignment is only considered when actually tracking the path, preventing awkward initialization motions 
        # preventing the robot from leaving the path to achieve the appropriate heading.
        offset_from_furthest: 20
        # Whether to consider path’s orientations in path alignment, which can be useful when paired with feasible smac planners to incentivize 
        # directional changes only where/when the smac planner requests them. If you want the robot to deviate and invert directions where 
        # the controller sees fit, keep as false. If your plans do not contain orientation information (e.g. navfn), keep as false.
        use_path_orientations: false
      # ----------------------------------------------------------------------------------------------------
      # This critic incentivize making progress along the path. This is what drives the robot forward along the path.
      PathFollowCritic:
        enabled: true
        # Power order to apply to term.
        cost_power: 1
        # Weight to apply to critic term.
        cost_weight: 8.0
        # Number of path points after furthest one any trajectory achieves to drive path tracking relative to.
        offset_from_furthest: 5
        # Distance (m) between robot and goal to stop considering path following and allow goal critics to take over. It is wise to start with 
        # this as being the same as your prediction horizon to have a clean hand-off with the goal critic.
        threshold_to_consider: 0.8
      # ----------------------------------------------------------------------------------------------------
      # This critic penalizes trajectories at a high relative angle to the path. This helps the robot make sharp turns when necessary 
      # due to large accumulated angular errors.
      PathAngleCritic:
        enabled: true
        # Default 1. Power order to apply to term.
        cost_power: 1
        # Default 2.2. Weight to apply to critic term.
        cost_weight: 2.0
        # Default 4. Number of path points after furthest one any trajectory achieves to compute path angle relative to.
        offset_from_furthest: 4
        # Default 0.5. Distance between robot and goal above which path angle cost stops being considered
        threshold_to_consider: 0.5
        # Default 0.785398. Angular distance between robot and goal above which path angle cost starts being considered
        max_angle_to_furthest: 0.1
        # Default 0 (Forward Preference). Enum type for mode of operations for the path angle critic depending on path input types and behavioral desires. 
        # 0: Forward Preference, penalizes high path angles relative to the robot's orientation to incentivize turning towards the path. 
        # 1: No directional preference, penalizes high path angles relative to the robot's orientation or mirrored orientation (e.g. reverse), which ever is less, 
        #          when a particular direction of travel is not preferable. 
        # 2: Consider feasible path orientation, when using a feasible path whereas the path points have orientation information (e.g. Smac Planners), 
        #           consider the path's requested direction of travel to penalize path angles such that the robot will follow the path in the requested direction.
        mode: 1

      # ----------------------------------------------------------------------------------------------------
      # This critic penalizes unnecessary ‘twisting’ with holonomic vehicles. It adds a constraint on the rotation angle to keep it consistent.  
      TwirlingCritic:
        enabled: true
        # Power order to apply to term.
        twirling_cost_power: 1
        # Weight to apply to critic term.
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: "base_link"
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.16, -0.13], [0.16, 0.13], [-0.16, 0.13], [-0.16, -0.13]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.01
          obstacle_max_range: 4.5
          obstacle_min_range: 0.01
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.16, -0.13], [0.16, 0.13], [-0.16, 0.13], [-0.16, -0.13]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.01
          obstacle_max_range: 4.5
          obstacle_min_range: 0.01
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.5
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


#In general though, the following table is a good guide for the optimal planning plugin for different types of robot bases:
# Plugin Name                 Supported Robot Types
# NavFn Planner               Circular Differential, Circular Omnidirectional
# Smac Planner 2D             Circular Differential, Circular Omnidirectional
# Theta Star Planner          Circular Differential, Circular Omnidirectional
# Smac Hybrid-A* Planner      Non-circular or Circular Ackermann, Non-circular or Circular Legged
# Smac Lattice Planner        Non-circular Differential, Non-circular Omnidirectional, Arbitrary
# Since the planning problem is primarily driven by the robot type, the table accurately summarizes the advice to users 
# by the maintainers. Within the circular robot regime, the choice of planning algorithm is dependent on application and desirable behavior. 
# NavFn will typically make broad, sweeping curves; Theta* prefers straight lines and supports them at any angle; 
# and Smac 2D is essentially a classical A* algorithm with cost-aware penalties.
# The NavfnPlanner is a global planner plugin for the Nav2 Planner server. It implements the Navigation Function
#  planner with either A* or Dij. expansions. It is largely equivalent to its counterpart in ROS 1 Navigation. 
# The Navfn planner assumes a circular robot (or a robot that can be approximated as circular for the purposes 
# of global path planning) and operates on a weighted costmap.
# See https://docs.nav2.org/tuning/index.html for details
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac 2D global planner for circular differential/omni robots.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # Tolerance in meters between requested goal pose and end of path.
      tolerance: 0.2
      # Keep full-resolution planning for tighter indoor path quality.
      downsample_costmap: false
      downsampling_factor: 1
      # Stop conditions for planning loop.
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      # Higher values bias the global path toward lower-cost center space in corridors/corners.
      cost_travel_multiplier: 4.0
      # Whether to allow planning in unknown space.
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# The nav2_velocity_smoother is a package containing a lifecycle-component node for smoothing velocities sent by Nav2 to robot controllers. 
# The aim of this package is to implement velocity, acceleration, and dead band smoothing from Nav2 to reduce wear-and-tear on robot motors 
# and hardware controllers by smoothing out the accelerations/jerky movements that might be present with some local trajectory planners' control efforts.
# It supports differential drive and omnidirectional robot platforms primarily, but is applicable to ackermann as well with some interpretations of Twist. 
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0  # Rate to run smoother
    scale_velocities: false  # scale velocities proportionally if any axis is outside of acceleration range to follow same vector, if possible
    feedback: "OPEN_LOOP"  # Type of feedback for current speed. Open loop uses the last smoothed output. Closed loop uses robot odometry
    max_velocity: [0.5, 0.5, 2.5]  # Maximum velocities, ordered [Vx, Vy, Vw]
    min_velocity: [-0.5, -0.5, -2.5]  # Minimum velocities, ordered [Vx, Vy, Vw]
    deadband_velocity: [0.0, 0.0, 0.0]  # A dead band of velocities below which they should be zero-ed out for sending to the robot base controller, ordered [Vx, Vy, Vw]
    velocity_timeout: 1.0  # Time (s) after which if no new velocity commands are received to zero out and stop
    max_accel: [2.5, 2.5, 3.2]  # Maximum acceleration, ordered [Ax, Ay, Aw]
    max_decel: [-2.5, -2.5, -3.2]  # Maximum deceleration, ordered [Ax, Ay, Aw]
    odom_topic: "/odometry/filtered"  # Topic of odometry to use for estimating current velocities
    odom_duration: 0.1  # Period of time (s) to sample odometry information in for velocity estimation
    enable_stamped_cmd_vel: false # Whether to stamp the velocity. True uses TwistStamped. False uses Twist  

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.6
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02

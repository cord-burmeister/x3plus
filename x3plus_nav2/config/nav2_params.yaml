# AMCL implements the server for taking a static map and localizing the robot within it using an Adaptive Monte-Carlo Localizer.
# https://docs.nav2.org/configuration/packages/configuring-amcl.html
amcl:
  ros__parameters:
    use_sim_time: True

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan

    robot_model_type: nav2_amcl::DifferentialMotionModel

    set_initial_pose: true
    always_reset_initial_pose: true

    tf_broadcast: true
    # Time with which to post-date the transform that is published, to indicate that this transform is valid into the future.
    transform_tolerance: 2.0

    # Matches the default value in the official guide of 0.2. This is a reasonable default for the expected process noise in odometry’s rotation estimate from rotation.
    # alpha1 controls how much rotation affects the robot’s rotation estimate. Increasing this value makes the system more cautious about rotational movements, 
    # assuming more uncertainty when the robot turns. Decreasing it makes the system more confident about its rotation estimates, which can be risky 
    # if your robot’s sensors aren’t very accurate.
    alpha1: 0.2
    # Matches the default value of 0.2. A suitable default for expected process noise in rotation estimate from translation.
    # alpha2 handles how forward motion affects rotation estimates. If you increase this value, the robot becomes more uncertain about its rotation when moving forward, 
    # leading to more conservative behavior. Decreasing it means the robot will be more confident that moving forward won’t affect its rotational accuracy, 
    # which might be too optimistic for many robots.
    alpha2: 0.2
    # Matches the default of 0.2. Appropriate for expected process noise in translation estimate from translation.
    # alpha3 determines how forward motion affects position estimates. Increasing this makes the robot more uncertain about its position when moving forward, 
    # causing it to rely more on sensor data. Decreasing it means the robot will trust its forward motion more, which can be good for robots with very accurate
    #  wheel encoders but risky for others.
    alpha3: 0.2
    # Same as default. Works well for expected process noise in translation estimate from rotation in most cases.
    # alpha4 manages how rotation affects position estimates. When increased, the system assumes more position uncertainty during turns, making it more reliant
    # on sensor data to confirm its location. Decreasing it means the robot will be more confident about maintaining position accuracy during turns, 
    # which might not be realistic for many robots.
    alpha4: 0.2
    # Aligns with default of 0.2. Good value for translation noise in omni models.
    # Specific to omnidirectional robots, this controls translation noise. Increasing this value makes the robot more cautious about its position 
    # estimates during omnidirectional movement. Decreasing it makes the robot more confident in its position during sideways motion, 
    # which should only be done if you have very accurate encoders.
    alpha5: 0.2

    # Beam skipping - ignores beams for which a majority of particles do not agree with the map
    # prevents correct particles from getting down weighted because of unexpected obstacles
    # such as humans
    do_beamskip: false
    
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # RPLIDAR C1 Range
    # 0.05–12.0 m (white target, 90% reflectivity)
    # 0.05–6.0 m (black target, 10% reflectivity)
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # A value of 1 means it updates after every movement. Increasing this number means less frequent updates, 
    # which can help maintain diverse position estimates but might make the robot slower to adapt. 
    # Decreasing it below 1 isn’t recommended.
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2

    update_min_a: 0.1
    update_min_d: 0.1

    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    # Setting pose (29.350000): 0.019 0.003 0.000
    initial_pose:
      x: 0.019 
      y: .003
      z: 0.0
      yaw: 0.0 #yaw: 1.615

bt_navigator:
  ros__parameters:
    use_sim_time: True
    # Reference frame.
    global_frame: map
    robot_base_frame: base_footprint
    # Topic on which odometry is published
    odom_topic: /odometry/filtered
    # Duration (in milliseconds) for each iteration of BT execution.
    bt_loop_duration: 100
    # Default timeout value (in milliseconds) while a BT action node is waiting for
    # acknowledgement from an action server. This value will be overwritten for a 
    # BT node if the input port “server_timeo
    #default_server_timeout: 20
    default_server_timeout: 1000
    
    wait_for_service_timeout: 50000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # default_nav_to_pose_bt_xml: replace/with/path/to/bt.xml # or $(find-pkg-share my_package)/behavior_tree/my_nav_to_pose_bt.xml
    # default_nav_through_poses_bt_xml: replace/with/path/to/bt.xml # or $(find-pkg-share my_package)/behavior_tree/my_nav_through_poses_bt.xml

    # List of behavior tree node shared libraries. All Nav2 BT libraries are automatically
    # included for you, so this only needs to include your new custom plugins (new to Jazzy).
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    # General controller server parameters
    # Odometry topic consumed by the controller for velocity and motion feedback.
    # Impact: wrong odometry degrades tracking and can trigger false progress failures.
    # Default: plugin/launch dependent; practical requirement is a stable, filtered odom source.
    odom_topic: "/odometry/filtered"
    # cmd_vel_topic: "/my_robot/cmd_vel"  
    use_sim_time: true
    # Controller loop rate in Hz.
    # Impact: higher values improve responsiveness but raise CPU load; lower values reduce compute cost but can make tracking feel sluggish.
    # Common Nav2 default: 20.0. Practical range: 5.0 to 30.0 for most robots.
    controller_frequency: 10.0
    # Minimum commanded x velocity treated as non-zero.
    # Impact: higher values suppress tiny noisy commands but can prevent very slow precise motion.
    # Common Nav2 example default: 0.001. Valid range: >= 0.0, practical range: 0.0 to 0.02.
    min_x_velocity_threshold: 0.001
    # Minimum commanded y velocity treated as non-zero.
    # Impact: increasing this filters lateral jitter; too high disables fine strafing on omnidirectional bases.
    # Common Nav2 example default: 0.5 for differential-style examples, but omni robots usually need much lower. Valid range: >= 0.0, practical range: 0.0 to 0.05.
    min_y_velocity_threshold: 0.01
    # Minimum commanded yaw rate treated as non-zero.
    # Impact: higher values reduce spin dithering, but can make fine heading convergence harder.
    # Common Nav2 example default: 0.001. Valid range: >= 0.0, practical range: 0.0 to 0.05.
    min_theta_velocity_threshold: 0.001
    # Allowed time in seconds the controller may fail before the action aborts.
    # Impact: larger values tolerate transient blockage or unstable sensing; smaller values fail fast.
    # Common Nav2 default: 0.0 in many setups. Valid range: >= 0.0, practical range: 0.0 to 2.0.
    failure_tolerance: 0.6
    # Active progress checker plugin ID.
    # Impact: selects the logic used to decide whether the robot is making progress.
    progress_checker_plugin: progress_checker
    # Active goal checker plugin IDs.
    # Impact: chooses the criteria for declaring a goal reached.
    goal_checker_plugins: [general_goal_checker]   # "precise_goal_checker"
    # Active local controller plugin IDs.
    # Impact: selects the algorithm stack used to generate cmd_vel.
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # Minimum displacement in meters required inside the allowance window.
      # Impact: increasing this catches stalls sooner but can false-trigger in tight maneuvers; decreasing it is more forgiving.
      # Common Nav2 example default: 0.5. Valid range: > 0.0, practical range: 0.02 to 0.5.
      required_movement_radius: 0.05 # was 0.5 
      # Time window in seconds allowed to achieve the required movement radius.
      # Impact: larger values reduce false stall detection; smaller values detect genuine stuck states faster.
      # Common Nav2 example default: 10.0. Valid range: > 0.0, practical range: 5.0 to 60.0.
      movement_time_allowance: 40.0 # was 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      # If true, latches the XY goal reached state and focuses on orientation afterward.
      # Impact: helps avoid repeatedly losing the goal state due to tiny oscillations near the target.
      # Common default: true. Valid values: true or false.
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Position tolerance in meters for goal completion.
      # Impact: larger values make docking easier but reduce final placement precision.
      # Common Nav2 example default: 0.25. Valid range: > 0.0, practical range: 0.05 to 0.5.
      xy_goal_tolerance: 0.2
      # Heading tolerance in radians for goal completion.
      # Impact: larger values accept looser final orientation; smaller values can cause extra spinning near the goal.
      # Common Nav2 example default: 0.25. Valid range: > 0.0, practical range: 0.05 to 0.5.
      yaw_goal_tolerance: 0.1
    # DWB parameters
    FollowPath:
      # With 180-degree lidar, rotate into heading before translating for better front-sector coverage.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # Underlying local planner used after the rotation shim aligns the robot.
      # Impact: this determines the actual trajectory sampling and scoring behavior.
      primary_controller: "dwb_core::DWBLocalPlanner"
      # Heading error in radians above which the shim rotates before handing off to DWB.
      # Impact: larger values allow more translation while misaligned; smaller values favor facing-forward starts.
      # Common RotationShim default: 0.785 rad. Valid range: > 0.0, practical range: 0.2 to 1.0.
      angular_dist_threshold: 0.2
      # Distance ahead in meters used to estimate the desired heading along the path.
      # Impact: larger values smooth the heading target; smaller values react more tightly to local curvature.
      # Default varies by release/plugin. Valid range: > 0.0, practical range: 0.1 to 0.5.
      forward_sampling_distance: 0.25
      # Angular velocity used by the shim while rotating into heading.
      # Impact: higher values align faster but can overshoot on low-traction platforms.
      # Default varies by release/plugin. Valid range: > 0.0, practical range: 0.3 to 1.5 rad/s.
      rotate_to_heading_angular_vel: 0.85
      # Maximum angular acceleration during shim rotation.
      # Impact: higher values make heading acquisition snappier; lower values are smoother and easier on actuators.
      # Default varies by release/plugin. Valid range: > 0.0, practical range: 0.5 to 4.0 rad/s^2.
      max_angular_accel: 2.2
      # Time horizon in seconds for shim collision simulation while rotating or transitioning.
      # Impact: larger values are safer but more conservative near obstacles.
      # Default varies by release/plugin. Valid range: > 0.0, practical range: 0.5 to 3.0.
      simulate_ahead_time: 1.0
      # Publishes detailed trajectory scoring for debugging.
      # Impact: useful for tuning, but can add log/visualization overhead.
      # Common DWB default: false. Valid values: true or false.
      debug_trajectory_details: true
      # Minimum forward x velocity sampled by DWB.
      # Impact: raising this prevents very slow crawling; lowering it improves precise starts and near-goal control.
      # Common DWB default: 0.0. Valid range: >= 0.0 and <= max_vel_x.
      min_vel_x: 0.0
      # Minimum lateral y velocity sampled by DWB.
      # Impact: more negative values allow stronger strafing; values near zero bias the robot toward heading-aligned motion.
      # Common DWB default for non-holonomic robots: 0.0. Valid range: <= 0.0 for symmetric omni configs, practical range: -0.2 to 0.0.
      min_vel_y: 0.0      # Keep limited strafing, but bias more strongly toward heading-aligned motion
      # Maximum forward x velocity in m/s.
      # Impact: higher values improve throughput but require matching acceleration limits and collision margins.
      # Common DWB example default: 0.26. Valid range: > 0.0, practical range: 0.1 to 1.0.
      max_vel_x: 0.30
      # Maximum lateral y velocity in m/s.
      # Impact: larger values increase strafing authority; smaller values encourage forward-facing travel.
      # Common DWB default for differential robots: 0.0. Valid range: >= 0.0, practical range for small omni bases: 0.0 to 0.3.
      max_vel_y: 0.0       # Limit lateral speed so robot is more likely to face travel direction
      # Maximum angular velocity in rad/s.
      # Impact: higher values turn faster but can destabilize tracking and increase overshoot.
      # Common DWB example default: 1.0. Valid range: > 0.0, practical range: 0.3 to 2.0.
      max_vel_theta: 0.65
      # Minimum translational speed magnitude in the XY plane.
      # Impact: values above zero prevent slow motion commands; zero permits stationary rotation and fine creeping.
      # Common DWB default: 0.0. Valid range: >= 0.0 and <= max_speed_xy.
      min_speed_xy: 0.0
      # Maximum translational speed magnitude in the XY plane.
      # Impact: acts as the overall cap on combined x/y motion.
      # Common DWB example default: about 0.26. Valid range: > 0.0, must be >= max component speed used in practice.
      max_speed_xy: 0.34
      # Minimum angular speed magnitude in rad/s for sampled trajectories.
      # Impact: higher values prevent tiny ineffective turns but can make fine orientation control harder.
      # Common DWB example default: 0.0. Valid range: >= 0.0 and <= max_vel_theta.
      min_speed_theta: 0.10
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      # Maximum forward acceleration in m/s^2.
      # Impact: higher values improve responsiveness; lower values reduce wheel slip and actuator stress.
      # Common DWB example default: 2.5. Valid range: > 0.0, practical range: 0.2 to 5.0.
      acc_lim_x: 1.0
      # Maximum lateral acceleration in m/s^2.
      # Impact: relevant for mecanum/omni robots; higher values enable faster strafing transitions.
      # Common differential default: 0.0 or unused. Valid range: >= 0.0, practical range for small omni bases: 0.2 to 3.0.
      acc_lim_y: 1.0       # Mecanum: enable lateral acceleration
      # Maximum angular acceleration in rad/s^2.
      # Impact: higher values allow quicker yaw response but can cause jerky rotation.
      # Common DWB example default: 3.2. Valid range: > 0.0, practical range: 0.5 to 6.0.
      acc_lim_theta: 2.2
      # Maximum forward deceleration in m/s^2, expressed as a negative value.
      # Impact: more negative values stop faster; values too close to zero lengthen stopping distance.
      # Common DWB example default: -2.5. Valid range: < 0.0, practical range: -5.0 to -0.2.
      decel_lim_x: -1.0
      # Maximum lateral deceleration in m/s^2, expressed as a negative value.
      # Impact: stronger magnitude improves lateral stopping and path correction on omni platforms.
      # Common differential default: 0.0 or unused. Valid range: < 0.0 for omni configs, practical range: -3.0 to -0.2.
      decel_lim_y: -1.0    # Mecanum: enable lateral deceleration
      # Maximum angular deceleration in rad/s^2, expressed as a negative value.
      # Impact: more negative values brake yaw faster; too aggressive can cause oscillation.
      # Common DWB example default: -3.2. Valid range: < 0.0, practical range: -6.0 to -0.5.
      decel_lim_theta: -2.2
      # If you want more trajectory diversity in the future you can raise vtheta_samples in steps of 4 while monitoring the loop timing warning in the logs.
      # Fewer linear velocity candidates to evaluate per cycle
      # Number of x-velocity samples evaluated each control cycle.
      # Impact: more samples improve search coverage but increase CPU cost linearly.
      # Common DWB default: 20. Valid range: integer >= 1, practical range: 6 to 30.
      vx_samples: 10
      # Number of y-velocity samples evaluated each control cycle.
      # Impact: more samples improve strafing options; on omni robots this can be a major CPU multiplier.
      # Common DWB default: 5. Valid range: integer >= 1, practical range: 1 to 10.
      vy_samples: 3        # Further reduce lateral options to favor facing-forward trajectories
      # The biggest CPU driver — 30 × 12 = 360 trajectories was too many at 15 Hz for the turtlebot 3 in Gazebo, but 16 × 12 = 192 is manageable. You can increase this if you have a more powerful computer and want more trajectory options to evaluate.
      # The total trajectory evaluations went from 30 × 16 (vx_samples x vtheta_samples) = 480 down to 16 × 12 = 192, which is well within budget at 10 Hz.
      # Number of angular velocity samples evaluated each cycle.
      # Impact: more samples improve turning choice resolution but raise CPU cost linearly.
      # Common DWB default: 20. Valid range: integer >= 1, practical range: 8 to 30.
      vtheta_samples: 12
      # sim_time: reduce from 1.5 to 1.0 to 1.2 for tighter tracking
      # but increase to 1.5 for better obstacle avoidance, but can cause more oscillation in tight spaces.
      # Forward simulation horizon in seconds for candidate trajectories.
      # Impact: larger values improve obstacle foresight but can make the controller less agile in tight spaces.
      # Common DWB example default: 1.7. Valid range: > 0.0, practical range: 0.8 to 3.0.
      sim_time: 2.0
      # Linear interpolation step in meters for trajectory scoring.
      # Impact: smaller values improve collision fidelity but increase compute cost.
      # Common DWB example default: 0.05. Valid range: > 0.0, practical range: 0.02 to 0.1.
      linear_granularity: 0.1
      # Angular interpolation step in radians for trajectory scoring.
      # Impact: smaller values improve rotational collision fidelity but increase compute cost.
      # Common DWB example default: 0.025. Valid range: > 0.0, practical range: 0.02 to 0.2.
      angular_granularity: 0.1
      # TF lookup tolerance in seconds while transforming plans and costmap data.
      # Impact: larger values tolerate timestamp skew; too large can hide timing problems.
      # Common DWB example default: 0.2. Valid range: >= 0.0, practical range: 0.05 to 0.5.
      transform_tolerance: 0.25
      # Local controller XY goal tolerance in meters.
      # Impact: should generally match or be slightly tighter than the goal checker to avoid fighting near the goal.
      # Common example default: 0.25. Valid range: > 0.0, practical range: 0.05 to 0.5.
      xy_goal_tolerance: 0.2
      # Translational speed below which the robot is considered stopped.
      # Impact: increasing this makes stop detection easier but can misclassify slow motion as stopped.
      # Common DWB example default: 0.25 in older TB3 examples, often reduced for precise robots. Valid range: >= 0.0, practical range: 0.005 to 0.1.
      trans_stopped_velocity: 0.02
      # Stops evaluating once a valid best is found, cuts cost further
      # Impact: improves runtime, but exhaustive scoring may find a slightly better trajectory when disabled.
      # Common DWB default: true. Valid values: true or false.
      short_circuit_trajectory_evaluation: true
      # Keeps internal goal-progress state between cycles.
      # Impact: helps stabilize behavior near the goal and reduces oscillatory replanning decisions.
      # Common DWB default: true. Valid values: true or false.
      stateful: true


      # Recommended order:
      # ```yaml
      # critics: [Oscillation, BaseObstacle, Twirling, PreferForward, PathAlign, GoalAlign, PathDist, GoalDist]
      # ```
      # The logic behind the full ordering:
      # | Position | Critic | Role |
      # |---|---|---|
      # | 1 | `Oscillation` | Disqualifier — marks oscillating trajectories invalid immediately |
      # | 2 | `BaseObstacle` | Safety disqualifier — rejects collision trajectories early |
      # | 3 | `Twirling` | Soft penalty — discourages spinning, no hard rejection |
      # | 4 | `PreferForward` | Directional bias — rewards forward-facing motion |
      # | 5 | `PathAlign` | Heading scoring — aligns nose with path direction |
      # | 6 | `GoalAlign` | Heading scoring — aligns nose toward goal |
      # | 7 | `PathDist` | Distance scoring — keeps robot close to planned path |
      # | 8 | `GoalDist` | Distance scoring — draws robot toward goal |

      # Ordered list of DWB critics used to score candidate trajectories.
      # Impact: critic choice and order determine how motion tradeoffs are evaluated.
      critics: [Oscillation, BaseObstacle, Twirling, PreferForward, PathAlign, GoalAlign, PathDist, GoalDist]
      # RotateToGoal removed: mecanum can approach goal from any direction without rotating first.
      # if you want to keep safety and just allow higher sustained speed near walls, 
      # you can lower BaseObstacle.scale from 1.0 to 0.5.      
      # Weight for obstacle proximity cost.
      # Impact: higher values keep more clearance from obstacles but can reject narrow valid paths.
      # Common DWB examples often use 0.02 to 0.1 for meter-scored setups; exact effective range depends on map resolution and critic formulation. Practical tuning range here: 0.5 to 5.0.
      BaseObstacle.scale: 3.0
      # Penalty for unnecessary spinning/twirling.
      # Impact: higher values discourage in-place rotation during path following.
      # Common default varies by critic enablement. Valid range: >= 0.0, practical range: 0.0 to 10.0.
      Twirling.scale: 1.0
      # Practical range for your setup:
      #
      # 8.0 to 12.0: balanced
      # 12.0 to 16.0: strong front-facing bias
      # Above 16.0: usually too restrictive unless you want near-differential behavior
      PreferForward.scale: 14.0
      # With 180-degree lidar, keep nose closer to motion direction for better obstacle visibility.
      # Weight for aligning the robot heading with the local path direction.
      # Impact: higher values produce more nose-to-path behavior; too high can reduce lateral freedom on mecanum bases.
      # Common default varies by config. Valid range: >= 0.0, practical range: 0.0 to 20.0.
      PathAlign.scale: 18.0
      # Distance ahead on the path used to compute alignment heading.
      # Impact: larger values smooth the heading target; smaller values track sharp bends more tightly.
      # Common default varies by config. Valid range: > 0.0, practical range: 0.05 to 0.5 m.
      PathAlign.forward_point_distance: 0.2
      # Weight for aligning the robot heading toward the goal heading.
      # Impact: higher values emphasize final orientation earlier in the approach.
      # Common default varies by config. Valid range: >= 0.0, practical range: 0.0 to 20.0.
      GoalAlign.scale: 4.0
      # Forward lookahead distance used by the goal alignment critic.
      # Impact: larger values smooth heading corrections; smaller values react more locally near the goal.
      # Common default varies by config. Valid range: > 0.0, practical range: 0.05 to 0.5 m.
      GoalAlign.forward_point_distance: 0.1
      # PathDist.scale: 20.0 to 32.0 (start at 24.0)
      # Weight for minimizing lateral/metric distance from the path.
      # Impact: higher values hug the path more tightly; too high can make obstacle avoidance less flexible.
      # Common default varies by config. Valid range: >= 0.0, practical range: 1.0 to 32.0.
      PathDist.scale: 12.0
      # GoalDist.scale: lower to 0.5 to 1.5 (start at 1.0) so it stops cutting to goal too early
      # Weight for minimizing distance to goal.
      # Impact: higher values cut toward the goal more aggressively, sometimes at the expense of path fidelity.
      # Common default varies by config. Valid range: >= 0.0, practical range: 0.5 to 10.0.
      GoalDist.scale: 2.0
      # Weight for the RotateToGoal critic.
      # Impact: zero disables goal-rotation enforcement, which suits holonomic/mecanum robots that need not face the goal first.
      # Common default in many non-holonomic examples: 32.0. Valid range: >= 0.0, practical range: 0.0 to 64.0.
      RotateToGoal.scale: 22.0
      # Factor controlling how strongly linear speed is reduced while preparing to rotate to goal.
      # Impact: higher values slow the robot more aggressively near rotate-to-goal transitions.
      # Common default varies by config. Valid range: > 0.0, practical range: 1.0 to 10.0.
      RotateToGoal.slowing_factor: 1.3
      # Lookahead time in seconds for rotate-to-goal evaluation; -1 means use critic-specific default behavior.
      # Impact: larger positive values consider further future orientation effects.
      # Common default in examples: -1.0. Valid range: -1.0 or >= 0.0.
      RotateToGoal.lookahead_time: -1.0
    

local_costmap:
  local_costmap:
    ros__parameters:
      # Rate in Hz at which the local costmap is recalculated from sensor data.
      # Impact: higher values react faster to new obstacles; lower values reduce CPU load.
      # Common Nav2 default: 10.0. Valid range: > 0.0, practical range: 5.0 to 20.0.
      update_frequency: 10.0
      # Rate in Hz at which the costmap is published for visualization and downstream consumers.
      # Impact: can be lower than update_frequency to save bandwidth; too low causes stale Rviz display.
      # Common Nav2 default: 5.0. Valid range: > 0.0, practical range: 1.0 to 20.0.
      publish_frequency: 5.0
      # Reference frame for the rolling costmap; must match the odometry frame.
      # Impact: mismatch causes costmap drift and smeared obstacle marks.
      # Common Nav2 default: odom. Valid values: any valid TF frame, typically "odom".
      global_frame: odom
      # Robot base frame used to center the rolling window on the robot.
      # Impact: incorrect frame shifts the footprint relative to sensor data.
      # Common Nav2 default: base_link or base_footprint.
      robot_base_frame: base_footprint
      use_sim_time: True
      # Keep costmap centered on the robot rather than fixed at a global origin.
      # Impact: required for local costmap; disabling treats it as globally fixed.
      # Common Nav2 default: true. Valid values: true or false.
      rolling_window: true
      # Local costmap width in meters.
      # Impact: wider window provides more lookahead context; narrower reduces compute cost.
      # Common Nav2 example default: 3.0. Valid range: > 0.0, practical range: 3.0 to 10.0.
      width: 5
      # Local costmap height in meters.
      # Impact: same tradeoff as width; together they bound the local planning area.
      # Common Nav2 example default: 3.0. Valid range: > 0.0, practical range: 3.0 to 10.0.
      height: 5
      # Cell size in meters per pixel.
      # Impact: finer resolution improves narrow-passage accuracy but raises memory and compute cost quadratically.
      # Common Nav2 default: 0.05. Valid range: > 0.0, practical range: 0.02 to 0.1.
      resolution: 0.05
      # Mecanum robot polygon footprint: 30 cm (length) x 25 cm (width)
      # Points are [x, y] in meters, defined clockwise from front-right.
      footprint: "[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]"
      footprint_padding: 0.03 # Extra collision buffer to avoid grazing walls in simulation
      # This is the default settings for the plugins
      plugins: ["obstacle_layer", "inflation_layer"]
#      plugins: ["voxel_layer", "obstacle_layer", "inflation_layer"]
          # plugins: ["voxel_layer", "stvl_layer", "inflation_layer"]
      obstacle_layer:
            plugin: nav2_costmap_2d::ObstacleLayer
            # Enable or disable this layer entirely.
            # Impact: disabling removes all sensor-detected obstacles from the local costmap.
            # Common default: true. Valid values: true or false.
            enabled: true
            # Named list of sensor sources that feed this layer.
            # Impact: adding more sources increases obstacle coverage; each source adds compute cost.
            observation_sources: scan
            scan:
              topic: /scan
              # Maximum sensor reading height in meters; returns above this are discarded.
              # Impact: set slightly above robot height to filter ceiling reflections.
              # Common default: sensor/mounting dependent. Valid range: > 0.0, practical range: 0.5 to 2.5 m.
              max_obstacle_height: 1.2
              # Remove free-space cells along each ray when no obstacle is hit.
              # Impact: keeps costmap accurate as obstacles move away; disabling leaves ghost marks.
              # Common default: true. Valid values: true or false.
              clearing: true
              # Insert obstacle cells at the endpoint of each ray that hits an obstacle.
              # Impact: disabling prevents new obstacle marks; almost always true.
              # Common default: true. Valid values: true or false.
              marking: true
              # ROS message type for this source.
              # Impact: must match the topic's published type.
              # Valid values: LaserScan, PointCloud, PointCloud2.
              data_type: LaserScan
              # Maximum range in meters to raytrace free space from the sensor origin.
              # Impact: larger values clear more free space; setting beyond sensor accuracy can erase real obstacles.
              # Common Nav2 default: 3.0. Valid range: > 0.0, practical range: 1.5 to sensor max range.
              raytrace_max_range: 3.0
              # Minimum range in meters at which raytracing starts.
              # Impact: raising this suppresses close-range noise such as robot body reflections.
              # Common Nav2 default: 0.0. Valid range: >= 0.0, practical range: 0.0 to 0.3.
              raytrace_min_range: 0.0
              # Maximum range in meters at which a laser return is inserted as an obstacle.
              # Impact: reducing this prevents long-range noisy detections from polluting the costmap.
              # Common Nav2 default: 2.5. Valid range: > 0.0, must be <= raytrace_max_range.
              obstacle_max_range: 2.5
              # Minimum range in meters below which laser returns are ignored as obstacles.
              # Impact: raising this filters very close-range noise or ground hits on pitched lidars.
              # Common Nav2 default: 0.0. Valid range: >= 0.0, practical range: 0.0 to 0.3.
              obstacle_min_range: 0.0

      # http://wiki.ros.org/costmap_2d
      # Inflation is the process of propagating cost values out from occupied cells that decrease with distance.
      #  For this purpose, we define 5 specific symbols for costmap values as they relate to a robot.      
      # "Lethal" cost means that there is an actual (workspace) obstacle in a cell. So if the robot's center were in that cell, 
      # the robot would obviously be in collision.
      # "Inscribed" cost means that a cell is less than the robot's inscribed radius away from an actual obstacle. 
      # So the robot is certainly in collision with some obstacle if the robot center is in a cell that is at or above the inscribed cost.
      # "Possibly circumscribed" cost is similar to "inscribed", but using the robot's circumscribed radius as cutoff distance. 
      # Thus, if the robot center lies in a cell at or above this value, then it depends on the orientation of the robot whether it 
      # collides with an obstacle or not. We use the term "possibly" because it might be that it is not really an obstacle cell, 
      # but some user-preference, that put that particular cost value into the map. For example, if a user wants to express that a robot 
      # should attempt to avoid a particular area of a building, they may inset their own costs into the costmap for that region 
      # independent of any obstacles. Note, that although the value is 128 is used as an example in the diagram above, the true value 
      # is influenced by both the inscribed_radius and inflation_radius parameters as defined in the code.
      # "Freespace" cost is assumed to be zero, and it means that there is nothing that should keep the robot from going there.
      # "Unknown" cost means there is no information about a given cell. The user of the costmap can interpret this as they see fit.
      # All other costs are assigned a value between "Freespace" and "Possibly circumscribed" depending on their distance from a "Lethal" 
      # cell and the decay function provided by the user.
      # The rationale behind these definitions is that we leave it up to planner implementations to care or not about the exact footprint, 
      # yet give them enough information that they can incur the cost of tracing out the footprint only in situations where the orientation actually matters.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The cost_scaling_factor in the Nav2 local costmap configuration is a parameter used in the InflationLayer plugin. 
        # This factor determines how quickly the cost values decay as you move away from an obstacle. 
        # A higher cost_scaling_factor results in a steeper gradient, meaning the cost values drop off more rapidly from the obstacle12.
        # A scaling factor to apply to cost values during inflation. The cost function is computed as follows for all cells in the costmap 
        # further than the inscribed radius distance and closer than the inflation radius distance away from an actual obstacle: 
        # exp(-1.0 * cost_scaling_factor * (distance_from_obstacle - inscribed_radius)) * (costmap_2d::INSCRIBED_INFLATED_OBSTACLE - 1), 
        # where costmap_2d::INSCRIBED_INFLATED_OBSTACLE is currently 254. 
        # NOTE: since the cost_scaling_factor is multiplied by a negative in the formula, increasing the factor will decrease the resulting cost values.
 
        #################################################################################################################
        # For a robot with a 0.15 m radius, a good starting point is:
        # inflation_radius: 0.30 to 0.45 m
        # Practical default: 0.35 m
        # Quick rule of thumb:
        # inflation_radius ≈ robot_radius + safety_margin
        # With a 0.15 m robot, safety margin of 0.15 to 0.30 m gives 0.30 to 0.45 m.
        # Tuning guidance:
        # If the robot cuts corners too tightly or clips obstacles, increase toward 0.45 to 0.55.
        # If it is overly conservative in narrow spaces, decrease toward 0.28 to 0.35.
        # Keep cost_scaling_factor around 2.5 to 4.0 while tuning radius first.

        # the robot needs at least 2 × (robot_radius + inflation_radius) of clearance 

        # cost_scaling_factor: 3.0
        cost_scaling_factor: 4.0
        inflation_radius: 0.20 # Reduced for narrow doorway traversal; tune back up if clearance feels too tight
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # set the publish_voxel_map parameter to True to enable the publishing of the 3D voxel grid. 
        publish_voxel_map: True
#        publish_voxel_map: False 
        # parent ="base_footprint" child ="base_link" dz =  0.0815
        # parent="base_link" child="camera_link ==> dz = 0.03755
        # parent="base_link" child="camera_link ==> dz = 0.03755
        #origin_z: 0.11905
        origin_z: 0
        z_resolution: 0.05 # The resolution of the voxels in height is defined using the z_resolution parameter, while the num
        z_voxels: 16 # the number of voxels in each column is defined using the z_voxels parameter.
        max_obstacle_height: 2.0
        mark_threshold: 0 # The mark_threshold parameter sets the minimum number of voxels in a column to mark as occupied in the occupancy grid. 
#        observation_sources: scan
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.08
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08
        pointcloud:  # no frame set, uses frame from message
          topic: /depth/image_raw/points
          # This parameter specifies the maximum height of obstacles that should be considered in the costmap.
          # Any obstacle taller than this value won’t be inserted into the costmap.
          # It’s essential to set this parameter appropriately based on your robot’s height and the obstacles it encounters.
          max_obstacle_height: 1.2
          # The min_obstacle_height parameter specifies the minimum height (in meters) of a sensor reading considered valid.
          # Typically, this value is set to ground height, but it can be adjusted based on the noise model of the sensor.
          # By setting this parameter, you can filter out obstacles that are too close to the ground (e.g., small rocks, debris) and focus on relevant obstacles.
          min_obstacle_height: 0.05
          # This parameter defines the maximum distance from the robot at which an obstacle will be inserted into the costmap. 
          # In other words, obstacles beyond this range won’t affect the costmap.
          obstacle_max_range: 2.5
          # This parameter defines the minimum range at which obstacles are considered by the costmap.
          # Any obstacles closer than this range are ignored when updating the costmap.
          # It helps prevent false positives caused by sensor noise or reflections from nearby objects.
          obstacle_min_range: 0.05
          # This parameter defines the maximum range (distance) at which obstacles are considered during raytracing. 
          # Raytracing involves checking for obstacles along sensor rays (lines of sight) from the sensor origin. 
          # If an obstacle is detected within this range, it affects the voxel layer.
          raytrace_max_range: 8.0
          # This parameter defines the minimum range at which obstacles are considered. If your lidar is pitched toward the ground, 
          # it might affect the range in the x-direction, leading to the error. Make sure this value is appropriate for your setup.
          raytrace_min_range: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      stvl_layer:
              plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
              enabled: true
              voxel_decay: 15.
              decay_model: 0
              voxel_size: 0.05
              track_unknown_space: true
              unknown_threshold: 15
              mark_threshold: 0
              update_footprint_enabled: true
              combination_method: 1
              origin_z: 0.0
              publish_voxel_map: true
              transform_tolerance: 0.2
              mapping_mode: false
              map_save_duration: 60.0
              observation_sources: pointcloud
              pointcloud:
                data_type: PointCloud2
                topic: /depth/image_raw/points
                marking: true
                clearing: true
                obstacle_range: 3.0
                min_obstacle_height: 0.0
                max_obstacle_height: 2.0
                expected_update_rate: 0.0
                observation_persistence: 0.0
                inf_is_valid: false
                filter: "voxel"
                voxel_min_points: 0
                clear_after_reading: true
                max_z: 7.0
                min_z: 0.1
                vertical_fov_angle: 0.8745
                horizontal_fov_angle: 1.048
                decay_acceleration: 15.0
                model_type: 0        
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Rate in Hz at which the global costmap is updated from sensor observations.
      # Impact: increasing this makes the global map react faster to new dynamic obstacles but raises CPU load.
      # Common Nav2 default: 1.0. Valid range: > 0.0, practical range: 0.5 to 5.0.
      update_frequency: 1.0
      # Rate in Hz at which the global costmap is published for the planner and visualization.
      # Impact: can be lower than update_frequency; too low makes Rviz display stale.
      # Common Nav2 default: 1.0. Valid range: > 0.0, practical range: 0.5 to 5.0.
      publish_frequency: 1.0
      # Fixed reference frame for the global costmap.
      # Impact: must match the static map frame; mismatch prevents correct localization integration.
      # Common Nav2 default: map. Valid values: any valid TF frame, typically "map".
      global_frame: map
      # Robot base frame used for footprint-based collision checking.
      # Impact: incorrect frame offsets the collision footprint from where the robot actually is.
      # Common Nav2 default: base_link or base_footprint.
      robot_base_frame: base_footprint
      use_sim_time: True
      # Mecanum robot polygon footprint: 30 cm (length) x 25 cm (width)
      # Polygon footprint vertices [x, y] in meters defining the robot's 2D collision outline.
      # Impact: too small leads to collisions; too large makes the planner avoid passable gaps.
      # Valid values: YAML list of [x, y] pairs; must be a convex or simple polygon.
      footprint: "[[0.15, 0.125], [0.15, -0.125], [-0.15, -0.125], [-0.15, 0.125]]"
      # Extra buffer in meters added around the footprint polygon for additional collision safety.
      # Impact: larger values provide more clearance from walls but can block narrow passages.
      # Common Nav2 default: 0.01. Valid range: >= 0.0, practical range: 0.0 to 0.1.
      footprint_padding: 0.03
      # Cell size in meters per pixel for the global costmap.
      # Impact: finer resolution allows planning through tighter gaps but increases memory and replan time.
      # Common Nav2 default: 0.05. Valid range: > 0.0, practical range: 0.02 to 0.1.
      resolution: 0.05
      # If false, each pixel has one of 2 states: lethal obstacle or free. If true, each pixel has one of 3 states: lethal obstacle, free, or unknown.
      # default: false
      track_unknown_space: true
      # This is the default setting for the global planner plugins. 
      # https://robotics.stackexchange.com/questions/108412/obstacle-layer-in-global-costmap-not-set
      # Order of the plugins matters. I believe that to be the problem here. In your params you have
      # plugins: ["static_layer", "inflation_layer", "obstacle_layer", "voxel_layer"]
      # Which means that nav2 will first check static_layer, then run inflation on that, and after that run the costmap generation for obstacle_layer. 
      # In the Rviz screenshot there are small grey pixels under the laser scan markings which means the obstacle_layer is doing things.
      # To inflate the obstacle_layer detections (and voxel_layer which you might want to do as well) you have to move the 
      # inflation_layer to be the last plugin.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
#      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      # To load the STVL plugin, a new plugin name and type must be added. For example, if the application required an STVL layer and no obstacle layer, our file would be:
      # plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # Enable or disable this layer entirely.
        # Impact: disabling removes dynamic sensor-detected obstacles from global planning.
        # Common default: true. Valid values: true or false.
        enabled: True
#        observation_sources: scan pointcloud
        # Named list of sensor sources that feed this layer.
        # Impact: adding more sources increases coverage; each adds compute cost.
        observation_sources: scan 
        scan:
          topic: /scan
          # Maximum sensor reading height in meters; returns above this are discarded.
          # Impact: set slightly above robot height to avoid ceiling/overhang detections.
          # Common default: sensor/mounting dependent. Valid range: > 0.0, practical range: 0.5 to 2.5 m.
          max_obstacle_height: 2.0
          # Remove free-space cells along each ray when no obstacle is hit.
          # Impact: keeps the global map accurate as dynamic obstacles clear; disabling leaves ghost marks.
          # Common default: true. Valid values: true or false.
          clearing: True
          # Insert obstacle cells at the endpoint of each ray that hits an obstacle.
          # Impact: disabling prevents new obstacle marks from appearing; almost always true.
          # Common default: true. Valid values: true or false.
          marking: True
          # ROS message type for this source.
          # Impact: must match the topic's published type.
          # Valid values: LaserScan, PointCloud, PointCloud2.
          data_type: "LaserScan"
          # Maximum range in meters to raytrace free space in the global costmap.
          # Impact: larger values clear more area; very large values can clear real obstacles near the sensor range limit.
          # Common Nav2 default: 3.0. Valid range: > 0.0, practical range: up to sensor max reliable range.
          raytrace_max_range: 10.0
          # Minimum range in meters at which raytracing starts.
          # Impact: raising this avoids using very close returns that may be noise or the robot body.
          # Common Nav2 default: 0.0. Valid range: >= 0.0, practical range: 0.0 to 0.3.
          raytrace_min_range: 0.08
          # Maximum range in meters at which a laser return is inserted as an obstacle.
          # Impact: reducing this filters long-range noisy detections from the global map.
          # Common Nav2 default: 2.5. Valid range: > 0.0, must be <= raytrace_max_range.
          obstacle_max_range: 2.5
          # Minimum range in meters below which laser returns are ignored as obstacles.
          # Impact: raising this filters very close noise, robot body returns, or ground hits on pitched lidars.
          # Common Nav2 default: 0.0. Valid range: >= 0.0, practical range: 0.0 to 0.3.
          obstacle_min_range: 0.08
        # pointcloud:  # no frame set, uses frame from message
        #   topic: /depth/image_raw/points
        #   max_obstacle_height: 1.2
        #   min_obstacle_height: 0.2
        #   obstacle_max_range: 4.5
        #   obstacle_min_range: 0.05
        #   raytrace_max_range: 8.0
        #   raytrace_min_range: 0.05
        #   clearing: True
        #   marking: True
        #   data_type: "PointCloud2"                  
      # This implements a costmap layer taking in a map from either SLAM or map_server (or other) to place into the costmap. 
      # It resizes the costmap to its size and places the static obstacles on the planning space.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # QoS settings for map topic.
        map_subscribe_transient_local: True
        # Clear any occupied cells under robot footprint.
        # footprint_clearing_enabled: False 
      # This layer places an exponential decay functions around obstacles to increase cost to traverse near collision. 
      # It also places a lethal cost around obstacles within the robot’s fully inscribed radius - even if a robot is non-circular
      #  for optimized first-order collision checking.        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Exponential decay factor across inflation radius.
        cost_scaling_factor: 4.0
        # Radius to inflate costmap around lethal obstacles.
        inflation_radius: 0.20
        # Whether to inflate unknown cells as if lethal.
        # inflate_unknown: false
        # Whether to inflate unknown cells.
        # inflate_around_unknown: false
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # Whether or not to publish the underlying voxel grid for visualization purposes.
        # publish_voxel_map: True
        publish_voxel_map: False
        # The z origin of the map in meters.
        origin_z: 0.0
        # The z resolution of the map in meters/cell.
        z_resolution: 0.05
        # The number of voxels to in each vertical column, the height of the grid is z_resolution * z_voxels.
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
#        observation_sources: scan
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.08
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08      
        pointcloud:  # no frame set, uses frame from message
          topic: /depth/image_raw/points
          # This parameter specifies the maximum height of obstacles that should be considered in the costmap.
          # Any obstacle taller than this value won’t be inserted into the costmap.
          # It’s essential to set this parameter appropriately based on your robot’s height and the obstacles it encounters.
          max_obstacle_height: 1.2
          # The min_obstacle_height parameter specifies the minimum height (in meters) of a sensor reading considered valid.
          # Typically, this value is set to ground height, but it can be adjusted based on the noise model of the sensor.
          # By setting this parameter, you can filter out obstacles that are too close to the ground (e.g., small rocks, debris) and focus on relevant obstacles.
          # The maximum height in meters of a sensor reading considered valid. This is usually set to be slightly higher 
          # than the height of the robot. Setting this parameter to a value greater than the global max_obstacle_height parameter 
          # has no effect. Setting this parameter to a value less than the global max_obstacle_height will filter out points from 
          # this sensor above that height.
          min_obstacle_height: 0.1
          # The minimum height in meters of a sensor reading considered valid. This is usually set to be at ground height, 
          # but can be set higher or lower based on the noise model of your sensor.
          obstacle_max_range: 2.5
          # This parameter defines the minimum range at which obstacles are considered by the costmap.
          # Any obstacles closer than this range are ignored when updating the costmap.
          # It helps prevent false positives caused by sensor noise or reflections from nearby objects.
          obstacle_min_range: 0.05
          # This parameter defines the maximum range (distance) at which obstacles are considered during raytracing. 
          # Raytracing involves checking for obstacles along sensor rays (lines of sight) from the sensor origin. 
          # If an obstacle is detected within this range, it affects the voxel layer.
          raytrace_max_range: 8.0
          # This parameter defines the minimum range at which obstacles are considered. If your lidar is pitched toward the ground, 
          # it might affect the range in the x-direction, leading to the error. Make sure this value is appropriate for your setup.
          raytrace_min_range: 0.05
          # Clearing involves raytracing through a grid from the sensor origin to remove obstacle information.
          clearing: True
          # Marking involves changing the cost of a cell based on sensor data.
          marking: True
          # The data type associated with the topic, right now only "PointCloud", "PointCloud2", and "LaserScan" are supported.
          data_type: "PointCloud2"      
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /depth/image_raw/points
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 7.0
          min_z: 0.1
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 15.0
          model_type: 0        
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    # Absolute path to the map metadata YAML loaded by nav2_map_server.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    # Maximum time in seconds to wait for map save operations to complete.
    save_map_timeout: 5.0
    # Map mode: trinary, scale, or raw
    mode: "trinary"
    # Probability threshold below which a cell is saved as free space.
    free_thresh: 0.25
    # Probability threshold above which a cell is saved as occupied.
    occupied_thresh: 0.65
    # Subscribe with transient local QoS so late joiners receive the latest map.
    map_subscribe_transient_local: True
    # Image format for map files: pgm, png, etc.
    image_format: "pgm"


#In general though, the following table is a good guide for the optimal planning plugin for different types of robot bases:
# Plugin Name                 Supported Robot Types
# NavFn Planner               Circular Differential, Circular Omnidirectional
# Smac Planner 2D             Circular Differential, Circular Omnidirectional
# Theta Star Planner          Circular Differential, Circular Omnidirectional
# Smac Hybrid-A* Planner      Non-circular or Circular Ackermann, Non-circular or Circular Legged
# Smac Lattice Planner        Non-circular Differential, Non-circular Omnidirectional, Arbitrary
# Since the planning problem is primarily driven by the robot type, the table accurately summarizes the advice to users 
# by the maintainers. Within the circular robot regime, the choice of planning algorithm is dependent on application and desirable behavior. 
# NavFn will typically make broad, sweeping curves; Theta* prefers straight lines and supports them at any angle; 
# and Smac 2D is essentially a classical A* algorithm with cost-aware penalties.
# The NavfnPlanner is a global planner plugin for the Nav2 Planner server. It implements the Navigation Function
#  planner with either A* or Dij. expansions. It is largely equivalent to its counterpart in ROS 1 Navigation. 
# The Navfn planner assumes a circular robot (or a robot that can be approximated as circular for the purposes 
# of global path planning) and operates on a weighted costmap.
# See https://docs.nav2.org/tuning/index.html for details
planner_server:
  ros__parameters:
    # Expected planning loop frequency in Hz; used for diagnostics and timing warnings.
    expected_planner_frequency: 20.0
    use_sim_time: True
    # Enabled global planner plugin IDs.
    planner_plugins: ["GridBased"]
    GridBased:
      # The NavfnPlanner is a global planner plugin for the Nav2 Planner server. It implements the Navigation Function planner
      # with either A* or Dij. expansions. It is largely equivalent to its counterpart in ROS 1 Navigation. 
      # The Navfn planner assumes a circular robot (or a robot that can be approximated as circular for the purposes 
      # of global path planning) and operates on a weighted costmap.
      plugin: "nav2_navfn_planner/NavfnPlanner" # In Iron and older versions, "/" was used instead of "::"
      # Tolerance in meters between requested goal pose and end of path.
      tolerance: 0.5
      # Whether to use A*. If false, uses Dijkstra’s expansion.
      # The Navfn Planner plugin in ROS (Robot Operating System) can use either the Dijkstra or A* algorithm for path planning. 
      # Here’s a brief overview of the differences between these two algorithms:
      # Dijkstra’s Algorithm
      #   Wavefront Expansion: Dijkstra’s algorithm expands nodes in all directions uniformly, creating a wavefront from the start node.
      #   Optimality: It guarantees finding the shortest path in terms of cost from the start to the goal node.
      #   Speed: It can be slower because it explores all possible paths to ensure the shortest one is found.
      #   Use Case: Best for scenarios where the cost of traversing each edge is the same or when you need the absolute shortest path.
      # A* Algorithm
      #   Heuristic Expansion: A* uses a heuristic to guide its search, prioritizing nodes that are closer to the goal.
      #   Optimality: It also guarantees the shortest path, but only if the heuristic is admissible (never overestimates the cost to reach the goal).
      #   Speed: Generally faster than Dijkstra’s because it uses the heuristic to focus the search, reducing the number of nodes expanded.
      #   Use Case: Ideal for scenarios where you need faster pathfinding and can use a heuristic to estimate the cost to the goal.      
      use_astar: false
      # Whether to allow planning in unknown space.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    # Enabled path smoother plugin IDs.
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # Iteration stop threshold; lower values pursue a more exact smoothed solution.
      tolerance: 1.0e-10
      # Maximum number of smoothing iterations before giving up.
      max_its: 1000
      # Run an additional refinement pass on the smoothed path.
      do_refinement: True

behavior_server:
  ros__parameters:
    # Raw local costmap topic used by recovery behaviors for collision checking.
    costmap_topic: local_costmap/costmap_raw
    # Published robot footprint topic used by behaviors that need geometry awareness.
    footprint_topic: local_costmap/published_footprint
    # Recovery and auxiliary behavior execution loop frequency in Hz.
    cycle_frequency: 10.0
    # Enabled behavior plugin IDs available to the BT navigator.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Local planning frame for recovery behaviors.
    global_frame: odom
    robot_base_frame: base_footprint
    # TF lookup tolerance in seconds for behavior execution.
    transform_tolerance: 0.1
    use_sim_time: true
    # Forward simulation horizon in seconds used by certain behaviors.
    simulate_ahead_time: 2.0
    # Rotational speed limits for spin-style behaviors in rad/s.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    # Maximum rotational acceleration in rad/s^2.
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    # Waypoint processing loop frequency in Hz.
    loop_rate: 20
    # Continue remaining waypoints even if one waypoint task fails.
    stop_on_failure: false
    # Task executor plugin run at each waypoint.
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # Enable waiting behavior when a waypoint is reached.
      enabled: True
      # Pause duration at each waypoint in milliseconds.
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    # Rate in Hz at which smoothed velocity commands are generated.
    smoothing_frequency: 20.0
    # If true, scales all velocity axes proportionally when any axis exceeds limits.
    scale_velocities: False
    # OPEN_LOOP uses commanded velocity history; CLOSED_LOOP would use odometry feedback.
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.06, 0.85]   # Mecanum: x, y, theta
    min_velocity: [-0.4, -0.06, -0.85] # Mecanum: x, y, theta
    # Axis-wise acceleration limits for x, y, and theta.
    max_accel: [2.5, 1.5, 2.2]
    # Axis-wise deceleration limits for x, y, and theta.
    max_decel: [-2.5, -1.5, -2.2]
    # Odometry source used when feedback mode needs velocity estimation.
    odom_topic: "/odometry/filtered"
    # Amount of odometry history in seconds kept for smoothing feedback.
    odom_duration: 0.1
    # Minimum commanded velocity magnitude per axis before output is clamped to zero.
    deadband_velocity: [0.0, 0.0, 0.0]
    # Stop publishing if no new cmd_vel is received within this timeout in seconds.
    velocity_timeout: 1.0
